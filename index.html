<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業簽呈系統 - 完整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 p-4">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">簽呈進度追蹤系統</h1>
            <button id="auth-btn" onclick="handleAuthClick()" class="bg-gray-800 text-white px-4 py-2 rounded text-sm">管理員登入</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-4">簽呈列表</h2>
                <div id="doc-list" class="space-y-2"></div>
            </div>

            <div id="detail-section" class="bg-white p-4 rounded shadow hidden">
                <h2 id="detail-title" class="font-bold text-lg mb-2"></h2>
                
                <div id="admin-panel" class="hidden space-y-3 p-3 bg-indigo-50 rounded border mb-4">
                    <select id="action-stage" class="w-full p-2 border rounded">
                        <option value="部門主管">部門主管</option>
                        <option value="法務">法務</option>
                        <option value="採購部">採購部</option>
                    </select>
                    <div class="flex gap-2">
                        <button onclick="updateDocStatus('審核中')" class="flex-1 bg-amber-500 text-white p-2 rounded text-sm">送下關</button>
                        <button onclick="updateDocStatus('已核准')" class="flex-1 bg-green-600 text-white p-2 rounded text-sm">核准</button>
                    </div>
                </div>

                <div id="timeline-container" class="border-l-2 border-gray-200 ml-2 pl-4 space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://arosasnpwfkaiaglocex.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-LCdnK_X_Wh56tHtvWgx1g_-L20U16t";
        let allDocs = [], isAdmin = false, activeIndex = null;

        // 1. 讀取資料
        async function loadData() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/documents?select=*`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            allDocs = data.map(d => ({ db_id: d.id, ...d.data }));
            renderList();
        }

        // 2. 渲染列表
        function renderList() {
            const list = document.getElementById('doc-list');
            list.innerHTML = allDocs.map((d, i) => `
                <div onclick="selectDoc(${i})" class="p-3 border rounded cursor-pointer hover:bg-gray-50">
                    <div class="font-bold">${d.title}</div>
                    <div class="text-xs text-gray-500">${d.status} - ${d.currentStep || ''}</div>
                </div>
            `).join('');
        }

        // 3. 顯示詳情與時間軸
        function selectDoc(index) {
            activeIndex = index;
            const d = allDocs[index];
            document.getElementById('detail-section').classList.remove('hidden');
            document.getElementById('detail-title').innerText = d.title;
            const container = document.getElementById('timeline-container');
            
            container.innerHTML = (d.history || []).map((node, i) => `
                <div class="relative">
                    <div class="absolute -left-[21px] w-3 h-3 rounded-full bg-blue-500"></div>
                    <div class="text-sm font-bold">${node.stage}</div>
                    ${isAdmin ? `
                        <input type="date" value="${node.time ? node.time.split(' ')[0] : ''}" 
                               onchange="updateDate(${i}, this.value)" class="border p-1 text-xs w-full">
                    ` : `<div class="text-xs text-gray-400">${node.time || ''}</div>`}
                </div>
            `).join('');
        }

        // 4. 管理員：修改時間軸日期
        async function updateDate(historyIndex, newDate) {
            const d = allDocs[activeIndex];
            d.history[historyIndex].time = newDate;
            await saveToCloud(d);
            selectDoc(activeIndex);
        }

        // 5. 管理員：更改狀態與關卡
        async function updateDocStatus(newStatus) {
            const d = allDocs[activeIndex];
            const newStage = document.getElementById('action-stage').value;
            d.status = newStatus;
            d.currentStep = newStage;
            d.history.push({ stage: newStage, time: new Date().toISOString().split('T')[0], note: '手動更新' });
            await saveToCloud(d);
            selectDoc(activeIndex);
        }

        // 6. 核心存檔邏輯
        async function saveToCloud(docData) {
            const db_id = docData.db_id;
            delete docData.db_id;
            await fetch(`${SUPABASE_URL}/rest/v1/documents?id=eq.${db_id}`, {
                method: 'PATCH',
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ data: docData })
            });
            loadData();
        }

        function handleAuthClick() {
            if(isAdmin) location.reload();
            const pass = prompt("請輸入管理員密碼");
            if(pass === "admin123") {
                isAdmin = true;
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('auth-btn').innerText = "登出管理員";
            }
        }

        loadData();
    </script>
</body>
</html>
