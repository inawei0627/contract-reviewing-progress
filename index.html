        const clearBtn = document.getElementById('clear-filter-btn');
        if (clearBtn) {
            const hasFilter = year || month || keyword || statusFilter !== 'all';
            clearBtn.classList.toggle('hidden', !hasFilter);
        }

        UI.Render.renderList();
    },

    /**
     * 跳至指定頁碼
     * @param {number} page 目標頁碼
     */
    goToPage(page) {
        const totalPages = Math.ceil(State.filteredDocuments.length / State.pageSize);
        State.currentPage = Math.max(1, Math.min(page, totalPages));
        UI.Render.renderList();
    },

    /**
     * 根據 allDocuments 的日期欄位，動態產生年份下拉選項
     */
    populateYearFilter() {
        const yearSet = new Set();
        State.allDocuments.forEach(doc => {
            const dateStr = doc?.updatedAt || doc?.created_at || '';
            const year = dateStr.slice(0, 4);
            if (/^\d{4}$/.test(year)) yearSet.add(year);
        });

        const select = document.getElementById('filter-year');
        if (!select) return;

        // 保留現有選取值
        const current = select.value;
        // 清除舊選項（保留「全部年份」）
        select.innerHTML = '<option value="">全部年份</option>';
        [...yearSet].sort((a, b) => b - a).forEach(year => {
            const opt = document.createElement('option');
            opt.value = year;
            opt.textContent = `${year} 年`;
            if (year === current) opt.selected = true;
            select.appendChild(opt);
        });
    },

    /**
     * 選取文件並顯示詳情面板
     * @param {number} index filteredDocuments 中的索引
     */
    selectDocument(index) {
        UI.Render.showDetail(index);
    },

    /**
     * 新增簽呈到雲端
     */
    async addDocument() {
        const title       = document.getElementById('form-title').value.trim();
        const applicant   = document.getElementById('form-applicant').value.trim();
        const dept        = document.getElementById('form-dept').value.trim();
        const currentStep = document.getElementById('form-current-step').value;
        const content     = document.getElementById('form-content').value.trim();

        // 表單驗證
        if (!Utils.isNonEmpty(title) || !Utils.isNonEmpty(applicant) || !Utils.isNonEmpty(dept)) {
            UI.Toast.show('warning', '請填寫主旨、申請人與申請部門');
            return;
        }

        // ✅ 優先使用管理員手動填寫的送件日期，未填才 fallback 為今日
        const submitDate = document.getElementById('form-submit-date')?.value || Utils.todayString();
        const newDoc = {
            title, applicant, dept, currentStep,
            content: content || '無詳細說明',
            status: '審核中',
            updatedAt: submitDate,          // ✅ 使用管理員指定的送件日期
            history: [{ time: submitDate, stage: `${currentStep}審核中`, note: '初次送審', status: 'pending' }],
        };

        const btn = document.getElementById('submit-btn');
        UI.Loading.setButton(btn, true);
        try {
            await Api.insert({ data: newDoc });
            UI.Toast.show('success', '新簽呈已成功發布至雲端 🎉');
            // 清空表單
            ['form-title', 'form-applicant', 'form-dept', 'form-content'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('form-current-step').value = Config.WORKFLOW_STAGES[0];
            document.getElementById('form-submit-date').value = Utils.todayString(); // ✅ 清空後重設為今日
            await this.loadDocuments();
        } catch (err) {
            console.error('[App.addDocument]', err);
            UI.Toast.show('error', `發布失敗：${err.message}`);
        } finally {
            UI.Loading.setButton(btn, false);
        }
    },

    /**
     * 從指定面板讀取操作表單的欄位值。
     *
     * 核心設計原則：欄位來源由「目前顯示的 UI 面板」決定，
     * 而非由文件的舊狀態（doc.status）推斷，避免狀態讀取錯位。
     *
     * @param {'normal'|'resubmit'} panel 目前顯示的操作面板
     * @returns {{ stageVal: string, dateVal: string, noteVal: string }}
     */
    _readActionFields(panel) {
        if (panel === 'resubmit') {
            return {
                stageVal: document.getElementById('action-resubmit-stage')?.value || '',
                // ✅ 明確讀取補正面板專屬的日期欄位；用 || '' 確保永遠回傳字串，
                //    讓 updateDocStatus 的 chosenDate = dateVal || Utils.todayString() 防呆邏輯正確觸發
                dateVal:  document.getElementById('action-resubmit-date')?.value || '',
                noteVal:  (document.getElementById('action-resubmit-note')?.value || '').trim(),
            };
        }
        // panel === 'normal'
        return {
            stageVal: document.getElementById('action-stage')?.value || '',
            // ✅ 明確讀取一般面板專屬的日期欄位；用 || '' 確保永遠回傳字串
            dateVal:  document.getElementById('action-date')?.value || '',
            noteVal:  (document.getElementById('action-note')?.value || '').trim(),
        };
    },

    /**
     * 更新文件狀態（送下一關、核准結案、駁回、補正重送）
     *
     * @param {string} targetStatus 目標狀態字串：'審核中' | Config.TERMINAL_STATUSES.APPROVED（'用印結案'） | Config.TERMINAL_STATUSES.REJECTED（'被駁回'）
     * @param {HTMLElement} triggerBtn 觸發操作的按鈕（用於切換 Loading 樣式）
     * @param {'normal'|'resubmit'} [panel='normal'] 目前顯示的操作面板。
     *   - 'normal'   : 一般審核面板（action-date / action-stage / action-note）
     *   - 'resubmit' : 補正重送面板（action-resubmit-date / action-resubmit-stage / action-resubmit-note）
     *
     * 時間邏輯優先權（需求 1）：
     *   chosenDate 優先採用管理員在對應 input 選取的日期（dateVal）；
     *   dateVal 為空時（管理員未選），自動 fallback 為今日日期（需求 3 防呆）。
     *
     * 歷程寫入一致性（需求 2）：
     *   所有 doc.history.push 與 doc.updatedAt 強制帶入 chosenDate，
     *   不使用預設的 getFormattedDateString() 或 new Date()。
     */
    async updateDocStatus(targetStatus, triggerBtn, panel = 'normal') {
        if (State.currentSelectedIndex === null || !State.isAdmin) return;

        const doc = State.filteredDocuments[State.currentSelectedIndex];
        const { REJECTED } = Config.TERMINAL_STATUSES;

        // 從正確的面板讀取所有欄位，日期來源不再含糊
        const { stageVal, dateVal, noteVal } = this._readActionFields(panel);

        // 驗證：「送下一關」及「補正重送」都需要選擇目標關卡
        if (targetStatus === '審核中' && !stageVal) {
            UI.Toast.show('warning', '請選擇下一個審核關卡');
            return;
        }

        // ✅ chosenDate 優先使用管理員手動選擇的日期，未填才 fallback 為今日
        const chosenDate = dateVal || Utils.todayString();
        if (!Array.isArray(doc.history)) doc.history = [];

        // --- 寫入本次操作的歷程節點 ---
        // 此節點記錄「管理員執行了什麼操作」
        doc.history.push({
            time:   chosenDate,           // ✅ 正確使用從對應面板讀取的日期
            stage:  targetStatus,
            note:   noteVal || (targetStatus === REJECTED ? '文件已駁回' : '已補正送審'),
            status: targetStatus === REJECTED ? 'error' : 'success',
        });

        if (targetStatus === '審核中') {
            // 「送下一關」或「補正重送」：額外新增一筆「等待審核」節點
            doc.history.push({
                time:   chosenDate,       // ✅ 同一批操作共用同一個 chosenDate，時間軸一致
                stage:  `${stageVal}審核中`,
                note:   '等待處理',
                status: 'pending',
            });
        }

        doc.updatedAt = chosenDate;       // ✅ 列表的「更新時間」欄位也同步使用選定日期

        UI.Loading.setButton(triggerBtn, true);
        try {
            // ✅ 依最新歷程節點回推 currentStep / status，並統一寫回 + 同步總表重繪
            await App.updateDocument(doc, true);
            UI.Toast.show('success', `狀態已更新為「${doc.status}」`);
            await this.loadDocuments();
        } catch (err) {
            console.error('[App.updateDocStatus]', err);
            UI.Toast.show('error', `更新失敗：${err.message}`);
        } finally {
            UI.Loading.setButton(triggerBtn, false);
        }
    },

    /**
     * 刪除目前選取的文件（管理員專用）
     */
    async deleteDocument() {
        if (State.currentSelectedIndex === null || !State.isAdmin) return;
        if (!confirm('確定要永久刪除此簽呈嗎？')) return;

        const doc = State.filteredDocuments[State.currentSelectedIndex];
        if (!doc) return;
        const btn = document.getElementById('delete-doc-btn');

        UI.Loading.setButton(btn, true);
        try {
            await Api.remove(doc.id);
            State.currentSelectedIndex = null;
            document.getElementById('detail-section').classList.add('hidden');
            UI.Toast.show('success', '刪除成功');
            await this.loadDocuments();
        } catch (err) {
            console.error('[App.deleteDocument]', err);
            UI.Toast.show('error', `刪除失敗：${err.message}`);
        } finally {
            UI.Loading.setButton(btn, false);
        }
    },
};

/* ══════════════════════════════════════════════════
   事件綁定 — 集中於 DOMContentLoaded 後統一設定
   ══════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
    // ── Session 恢復：頁面載入時優先檢查 localStorage，避免重新整理後登出 ──
    Auth.restoreSession();

    // ✅ 依 Config.WORKFLOW_STAGES 動態產生「當前關卡」下拉選單，確保新關卡（如「送用印」）自動納入
    UI.Render.populateStageOptions();

    // ── 統計卡片點選篩選 ──
    // 點擊卡片切換 State.filterStatus；再次點擊同一張卡片則取消篩選（回到「全部」）。
    document.querySelectorAll('.stats-card').forEach(card => {
        card.addEventListener('click', () => {
            const target = card.dataset.filter || 'all';
            State.filterStatus = (State.filterStatus === target) ? 'all' : target;
            UI.Render.updateStatsCardSelection();
            App.applyFilter();
        });
    });
    // 初始化卡片選取樣式（預設「全部」不顯示框線）
    UI.Render.updateStatsCardSelection();

    // 導覽列：管理員登入 / 登出
    document.getElementById('auth-btn').addEventListener('click', () => {
        State.isAdmin ? Auth.logout() : Auth.openModal();
    });

    // 密碼 Modal
    document.getElementById('modal-cancel-btn').addEventListener('click', () => Auth.closeModal());
    document.getElementById('modal-confirm-btn').addEventListener('click', () => Auth.verify());
    document.getElementById('modal-password-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') Auth.verify();
    });

    // 手動刷新
    document.getElementById('refresh-btn').addEventListener('click', () => App.loadDocuments());

    // 搜尋過濾
    document.getElementById('search-input').addEventListener('input', () => App.applyFilter());

    // 年份篩選
    document.getElementById('filter-year').addEventListener('change', e => {
        State.currentYear = e.target.value;
        App.applyFilter();
    });

    // 月份篩選
    document.getElementById('filter-month').addEventListener('change', e => {
        State.currentMonth = e.target.value;
        App.applyFilter();
    });

    // 清除篩選按鈕
    document.getElementById('clear-filter-btn').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        document.getElementById('filter-year').value  = '';
        document.getElementById('filter-month').value = '';
        State.currentYear   = '';
        State.currentMonth  = '';
        State.filterStatus  = 'all';
        UI.Render.updateStatsCardSelection();
        App.applyFilter();
    });

    // 分頁按鈕
    document.getElementById('page-first-btn').addEventListener('click', () => App.goToPage(1));
    document.getElementById('page-prev-btn').addEventListener('click',  () => App.goToPage(State.currentPage - 1));
    document.getElementById('page-next-btn').addEventListener('click',  () => App.goToPage(State.currentPage + 1));
    document.getElementById('page-last-btn').addEventListener('click',  () => {
        const totalPages = Math.ceil(State.filteredDocuments.length / State.pageSize);
        App.goToPage(totalPages);
    });

    // 新增簽呈
    document.getElementById('submit-btn').addEventListener('click', () => App.addDocument());

    // 刪除簽呈（詳情面板，管理員專用）
    document.getElementById('delete-doc-btn').addEventListener('click', () => App.deleteDocument());

    // 初始載入資料
    App.loadDocuments();
});

/* ══════════════════════════════════════════════════
   🔒 安全性升級建議（正式環境請務必閱讀）
   ══════════════════════════════════════════════════

   1. Supabase anon key 洩漏風險
      ─────────────────────────
      anon key 本身無法被隱藏（可由 Network tab 看到），
      其安全性完全依賴 Row-Level Security (RLS)。
      ✅ 請到 Supabase 後台 → Authentication → Policies 啟用 RLS，
         並設定政策，例如：
         - SELECT: 允許所有人 (public)
         - INSERT/UPDATE/DELETE: 僅允許 authenticated 角色

   2. 管理員密碼前端驗證問題
      ─────────────────────────
      目前 ADMIN_PASSWORD 直接比對，任何人開啟 DevTools 即可看到。
      建議升級路徑：
      方案 A（簡易）：改用 Supabase Auth 的 Email / OTP 登入
        ```javascript
        const { data, error } = await supabase.auth.signInWithPassword({
          email: 'admin@company.com',
          password: userInput,
        });
        ```
      方案 B（進階）：自建後端代理，前端不持有任何 service_role key，
        所有寫入操作透過後端 API 驗證後再執行。

   3. 輸入資料 XSS 防護
      ─────────────────────────
      本次重構已將所有使用者輸入改用 .textContent 設定，
      避免直接 innerHTML 插入用戶資料造成 XSS 攻擊。

   ══════════════════════════════════════════════════ */
