<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HYE-簽呈進度追蹤系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Toast 動畫 */
        @keyframes slideInRight {
            from { transform: translateX(110%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }
        .toast-enter  { animation: slideInRight .3s ease forwards; }
        .toast-leave  { animation: fadeOut .4s ease forwards; }

        /* 按鈕 Loading Spinner */
        .btn-loading { pointer-events: none; opacity: .7; }
        .btn-loading .btn-text { display: none; }
        .btn-loading .btn-spinner { display: inline-block !important; }
        .btn-spinner { display: none; }

        /* ── Tailwind v3 補丁（靜態 CSS 不含 JIT class）── */
        /* 紫色系（用印中卡片） */
        .bg-purple-50  { background-color: #faf5ff; }
        .bg-purple-100 { background-color: #f3e8ff; }
        .text-purple-600 { color: #9333ea; }
        .text-purple-700 { color: #7e22ce; }
        .ring-purple-500 { --tw-ring-color: #a855f7; }
        .border-purple-500 { border-color: #a855f7; }
        /* 透明度修飾 (bg-indigo-50/50) */
        .bg-indigo-50\/50 { background-color: rgba(238,242,255,.5); }
        /* line-clamp */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* backdrop-blur-sm（Modal 背景）*/
        .backdrop-blur-sm { backdrop-filter: blur(4px); }
        /* ring-2 */
        .ring-2 {
            --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width,0px) var(--tw-ring-offset-color,#fff);
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width,0px)) var(--tw-ring-color,rgba(59,130,246,.5));
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow,0 0 #0000);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

<!-- ───────────── 頂部導覽列 ───────────── -->
<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <i class="fa-solid fa-file-signature text-indigo-600 text-2xl mr-3"></i>
                <span class="text-xl font-bold text-gray-800">簽呈進度追蹤系統</span>
                <span id="role-badge" class="ml-2 px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded">訪客唯讀模式</span>
                <div id="global-loading" class="ml-4 hidden items-center text-xs text-indigo-600 font-medium">
                    <i class="fa-solid fa-circle-notch animate-spin mr-1"></i> 雲端資料同步中...
                </div>
            </div>
            <div class="flex items-center">
                <button id="auth-btn" class="text-sm bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-lock mr-1"></i> 管理員登入
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- ───────────── Toast 容器 ───────────── -->
<div id="toast-container" class="fixed top-5 right-5 z-[100] space-y-2 w-80 pointer-events-none"></div>

<!-- ───────────── 主內容 ───────────── -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 統計卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-5 mb-8">
        <div id="stats-card-all" data-filter="all"
            class="stats-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center cursor-pointer transition hover:shadow-md hover:border-gray-300">
            <div class="p-3 bg-blue-50 text-blue-600 rounded-lg mr-4"><i class="fa-solid fa-list-check text-xl"></i></div>
            <div>
                <p class="text-sm text-gray-500 font-medium">總簽呈數</p>
                <p id="count-total" class="text-2xl font-bold text-gray-800">0</p>
            </div>
        </div>
        <div id="stats-card-pending" data-filter="pending"
            class="stats-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center cursor-pointer transition hover:shadow-md hover:border-gray-300">
            <div class="p-3 bg-amber-50 text-amber-600 rounded-lg mr-4"><i class="fa-solid fa-spinner text-xl"></i></div>
            <div>
                <p class="text-sm text-gray-500 font-medium">審核中</p>
                <p id="count-pending" class="text-2xl font-bold text-amber-600">0</p>
            </div>
        </div>
        <div id="stats-card-rejected" data-filter="rejected"
            class="stats-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center cursor-pointer transition hover:shadow-md hover:border-gray-300">
            <div class="p-3 bg-red-50 text-red-600 rounded-lg mr-4"><i class="fa-solid fa-circle-xmark text-xl"></i></div>
            <div>
                <p class="text-sm text-gray-500 font-medium">被駁回</p>
                <p id="count-rejected" class="text-2xl font-bold text-red-600">0</p>
            </div>
        </div>
        <div id="stats-card-stamping" data-filter="stamping"
            class="stats-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center cursor-pointer transition hover:shadow-md hover:border-gray-300">
            <div class="p-3 bg-purple-50 text-purple-600 rounded-lg mr-4"><i class="fa-solid fa-stamp text-xl"></i></div>
            <div>
                <p class="text-sm text-gray-500 font-medium">用印中</p>
                <p id="count-stamping" class="text-2xl font-bold text-purple-600">0</p>
            </div>
        </div>
        <div id="stats-card-approved" data-filter="approved"
            class="stats-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center cursor-pointer transition hover:shadow-md hover:border-gray-300">
            <div class="p-3 bg-green-50 text-green-600 rounded-lg mr-4"><i class="fa-solid fa-circle-check text-xl"></i></div>
            <div>
                <p class="text-sm text-gray-500 font-medium">用印結案</p>
                <p id="count-approved" class="text-2xl font-bold text-green-600">0</p>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- 簽呈列表 -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-5 border-b border-gray-100 space-y-4 bg-gray-50">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-gray-800 flex items-center">
                            <i class="fa-solid fa-table-list mr-2 text-gray-500"></i> 簽呈進度總表
                        </h2>
                        <button id="refresh-btn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
                            <i class="fa-solid fa-arrows-rotate mr-1"></i> 手動更新
                        </button>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <input type="text" id="search-input" placeholder="輸入申請人、部門、主旨或內容關鍵字搜尋..."
                            class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-400 shadow-sm bg-white">
                    </div>
                    <!-- 年月篩選器 + 結果統計 -->
                    <div class="flex items-center gap-2 flex-wrap">
                        <i class="fa-solid fa-calendar-days text-gray-400 text-sm shrink-0"></i>
                        <select id="filter-year"
                            class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500 text-gray-700 shadow-sm">
                            <option value="">全部年份</option>
                        </select>
                        <select id="filter-month"
                            class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500 text-gray-700 shadow-sm">
                            <option value="">全部月份</option>
                            <option value="1">1 月</option>
                            <option value="2">2 月</option>
                            <option value="3">3 月</option>
                            <option value="4">4 月</option>
                            <option value="5">5 月</option>
                            <option value="6">6 月</option>
                            <option value="7">7 月</option>
                            <option value="8">8 月</option>
                            <option value="9">9 月</option>
                            <option value="10">10 月</option>
                            <option value="11">11 月</option>
                            <option value="12">12 月</option>
                        </select>
                        <button id="clear-filter-btn"
                            class="px-2.5 py-1.5 text-xs text-gray-500 hover:text-gray-700 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition shadow-sm hidden">
                            <i class="fa-solid fa-xmark mr-1"></i>清除篩選
                        </button>
                        <span id="filter-result-count" class="text-xs text-gray-400 ml-auto"></span>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 text-xs uppercase font-semibold">
                                <th class="px-6 py-3 w-1/2">編號 / 主旨 / 內容說明</th>
                                <th class="px-6 py-3">申請人</th>
                                <th class="px-6 py-3">當前關卡</th>
                                <th class="px-6 py-3">狀態</th>
                                <th class="px-6 py-3">更新時間</th>
                            </tr>
                        </thead>
                        <tbody id="document-list-body" class="divide-y divide-gray-100 text-sm">
                            <tr>
                                <td colspan="5" class="px-6 py-10 text-center text-gray-400">
                                    正在從雲端資料庫載入最新進度...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- 分頁控制列 -->
                <div id="pagination-bar" class="hidden px-5 py-3 border-t border-gray-100 bg-gray-50 flex items-center justify-between text-sm">
                    <span id="pagination-info" class="text-xs text-gray-500"></span>
                    <div class="flex items-center gap-1">
                        <button id="page-first-btn"
                            class="px-2 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fa-solid fa-angles-left"></i>
                        </button>
                        <button id="page-prev-btn"
                            class="px-2.5 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fa-solid fa-angle-left"></i> 上一頁
                        </button>
                        <div id="page-numbers" class="flex items-center gap-1"></div>
                        <button id="page-next-btn"
                            class="px-2.5 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition disabled:opacity-40 disabled:cursor-not-allowed">
                            下一頁 <i class="fa-solid fa-angle-right"></i>
                        </button>
                        <button id="page-last-btn"
                            class="px-2 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fa-solid fa-angles-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側面板 -->
        <div class="space-y-6">
            <!-- 新增簽呈表單（管理員專用） -->
            <div id="admin-form-section" class="bg-white p-6 rounded-xl shadow-sm border-2 border-indigo-100 hidden">
                <h2 class="font-bold text-gray-800 mb-4 flex items-center border-b pb-2">
                    <i class="fa-solid fa-feather-pointed mr-2 text-indigo-500"></i> 新增簽呈 (管理員專用)
                </h2>
                <div id="add-doc-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">簽呈主旨</label>
                        <input type="text" id="form-title" placeholder="例如：採購辦公室電腦三台"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">申請人</label>
                            <input type="text" id="form-applicant" placeholder="王大同"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">申請部門</label>
                            <input type="text" id="form-dept" placeholder="資訊部"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">當前關卡</label>
                        <select id="form-current-step"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500 text-gray-700 font-medium">
                            <option value="財務部" selected>財務部</option>
                            <option value="法務">法務</option>
                            <option value="採購部">採購部</option>
                            <option value="送用印">送用印</option>
                            <option value="副總">副總</option>
                            <option value="5樓(執行長.董事長)">5樓(執行長.董事長)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">內容說明</label>
                        <textarea id="form-content" rows="3" placeholder="請輸入簽呈詳細事由..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">
                            送件日期
                            <span class="text-gray-400 font-normal ml-1">（可往前回填，預設今日）</span>
                        </label>
                        <input type="date" id="form-submit-date"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white text-gray-700 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button id="submit-btn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-circle-notch animate-spin btn-spinner"></i>
                        <span class="btn-text"><i class="fa-solid fa-paper-plane mr-1"></i> 發布新簽呈到雲端</span>
                    </button>
                </div>
            </div>

            <!-- 簽呈詳情面板 -->
            <div id="detail-section" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 hidden">
                <div class="flex justify-between items-start border-b pb-3 mb-4">
                    <div>
                        <span id="detail-id" class="text-xs font-mono text-gray-400">#DOC-001</span>
                        <h3 id="detail-title" class="font-bold text-gray-800 text-base">簽呈主旨</h3>
                    </div>
                    <span id="detail-status-badge" class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">狀態</span>
                </div>

                <div class="text-xs text-gray-600 mb-4 bg-gray-50 p-3 rounded-lg space-y-1">
                    <p><strong>申請人：</strong><span id="detail-applicant">--</span> (<span id="detail-dept">--</span>)</p>
                    <p><strong>事由：</strong><span id="detail-content">--</span></p>
                </div>

                <!-- 管理員操作區 -->
                <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-3">簽核歷程時間軸</h4>
                <div id="timelineContainer" class="relative border-l-2 border-gray-200 ml-2 space-y-4 pb-2"></div>

                <!-- 刪除簽呈（管理員專用） -->
                <button id="delete-doc-btn"
                    class="hidden w-full mt-4 bg-white border border-red-300 hover:bg-red-50 text-red-600 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-circle-notch animate-spin btn-spinner"></i>
                    <span class="btn-text flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> 刪除此簽呈
                    </span>
                </button>
            </div>
        </div>
    </div>
</main>

<!-- ───────────── 密碼 Modal ───────────── -->
<div id="password-modal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-sm p-6 mx-4">
        <div class="flex items-center mb-4 text-indigo-600">
            <i class="fa-solid fa-shield-halved text-2xl mr-2"></i>
            <h3 class="text-lg font-bold text-gray-800">管理員權限驗證</h3>
        </div>
        <p class="text-xs text-gray-500 mb-4">請輸入管理員密碼以啟用新增與編輯功能。</p>
        <div class="space-y-4">
            <div>
                <input type="password" id="modal-password-input" placeholder="請輸入密碼"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                <p id="password-error-msg" class="text-xs text-red-500 mt-1 hidden">密碼錯誤，請重新輸入。</p>
            </div>
            <div class="flex gap-3 justify-end text-sm font-medium">
                <button id="modal-cancel-btn" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg transition">取消</button>
                <button id="modal-confirm-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition shadow-sm">確認登入</button>
            </div>
        </div>
    </div>
</div>

<!-- ───────────── 主要 JavaScript（模組化命名空間） ───────────── -->
<script>
/**
 * @fileoverview 企業簽呈進度追蹤系統 — 前端主程式
 *
 * 架構說明：
 *  - Config     : 靜態設定（URL、工作流程關卡）
 *  - Api        : 所有 Supabase REST API 呼叫集中於此
 *  - Auth       : 管理員身份驗證邏輯
 *  - State      : 唯一可變動的應用程式狀態物件
 *  - UI.Toast   : Toast 通知系統
 *  - UI.Loading : Loading 指示器
 *  - UI.Render  : DOM 渲染邏輯
 *  - App        : 高階商業邏輯，串聯 Api / State / UI
 *
 * 安全性注意事項（請閱讀）：
 *  ⚠️  SUPABASE_KEY (anon key) 屬於「公開金鑰」，其安全性來自於
 *      Supabase Row-Level Security (RLS) 政策，而非金鑰本身的保密性。
 *      請務必在 Supabase 後台為 `documents` 資料表啟用 RLS，
 *      並設定適當的讀寫政策，才能防止未授權存取。
 *
 *  ⚠️  ADMIN_PASSWORD 前端明碼驗證僅為 UI 層的保護，
 *      無法阻止熟悉 DevTools 的使用者繞過。
 *      正式環境建議整合 Supabase Auth（Email/OTP 或 Magic Link），
 *      並使用 service_role token 搭配後端代理進行寫入操作。
 *      詳見底部的「安全性升級建議」註解。
 */

'use strict';

/* ══════════════════════════════════════════════════
   Config — 所有靜態設定集中管理
   ══════════════════════════════════════════════════ */
const Config = Object.freeze({
    /**
     * Supabase 專案 URL（公開可見，安全性來自 RLS 政策）
     * @type {string}
     */
    SUPABASE_URL: 'https://arosasnpwfkaiaglocex.supabase.co',

    /**
     * Supabase anon key（公開金鑰，請確保 RLS 已正確設定）
     * @type {string}
     */
    SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyb3Nhc25wd2ZrYWlhZ2xvY2V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzU2MzcsImV4cCI6MjA5NjQxMTYzN30.0qBGNuyUTitC5fqlH2SAH4ZElm490ttcI8MmB4udDXM',

    /**
     * ⚠️ 臨時前端密碼，僅提供 UI 保護，無法阻止惡意繞過。
     * 正式環境請改用 Supabase Auth — 詳見底部安全性建議。
     * @type {string}
     */
    ADMIN_PASSWORD: 'admin123',

    /** 審核關卡清單（供表單選項使用） */
    WORKFLOW_STAGES: ['財務部', '法務', '採購部', '送用印', '副總', '5樓(執行長.董事長)'],

    /**
     * 結案狀態清單（最終態，非循環審核關卡）。
     * 統一定義於此，避免「用印結案」「被駁回」等字串散落於各處，
     * 未來若需調整文字，只需修改此處。
     */
    TERMINAL_STATUSES: Object.freeze({
        APPROVED: '用印結案',
        REJECTED: '被駁回',
    }),

    /**
     * 在 WORKFLOW_STAGES 中，有些關卡本身即代表一種特殊狀態，
     * 當簽核歷程最新節點對應到這些關卡時，「狀態」欄位會直接顯示該關卡名稱
     * （而非統一顯示為「審核中」）。例如：「送用印」。
     */
    STAGE_AS_STATUS: ['送用印'],

    /** Toast 自動消失時間（毫秒） */
    TOAST_DURATION_MS: 3500,

    /**
     * 管理員 Session 有效時間（毫秒），預設 8 小時。
     * localStorage 標記超過此時間後視為過期，需重新登入。
     */
    SESSION_TTL_MS: 8 * 60 * 60 * 1000,

    /** localStorage 使用的 key 名稱 */
    SESSION_KEY: 'hye_admin_session',
});

/* ══════════════════════════════════════════════════
   State — 集中管理可變動的應用程式狀態
   ══════════════════════════════════════════════════ */
const State = {
    /** @type {Array<Object>} 從雲端取回的所有文件 */
    allDocuments: [],
    /** @type {Array<Object>} 搜尋過濾後的文件（用於渲染） */
    filteredDocuments: [],
    /** @type {boolean} 目前是否處於管理員模式 */
    isAdmin: false,
    /** @type {number|null} 目前選取的文件在 filteredDocuments 中的索引 */
    currentSelectedIndex: null,
    /** @type {string} 目前選取的年份篩選值（空字串 = 全部） */
    currentYear: '',
    /** @type {string} 目前選取的月份篩選值（空字串 = 全部） */
    currentMonth: '',
    /**
     * @type {'all'|'pending'|'approved'|'rejected'|'stamping'} 統計卡片點選後的狀態篩選條件。
     * - 'all'      : 全部（總簽呈數卡片，或未選取任何卡片）
     * - 'pending'  : 審核中（包含「審核中」等所有未結案且非用印狀態）
     * - 'approved' : 用印結案（Config.TERMINAL_STATUSES.APPROVED）
     * - 'rejected' : 被駁回（Config.TERMINAL_STATUSES.REJECTED）
     * - 'stamping' : 用印中（status 欄位為「用印中」）
     */
    filterStatus: 'all',
    /** @type {number} 目前頁碼（1-based） */
    currentPage: 1,
    /** @type {number} 每頁顯示筆數 */
    pageSize: 20,
};

/* ══════════════════════════════════════════════════
   Api — 封裝所有 Supabase REST API 呼叫
   ══════════════════════════════════════════════════ */
const Api = {
    /**
     * 產生 Supabase 請求所需的通用 Headers
     * @returns {HeadersInit}
     */
    _getHeaders() {
        return {
            'apikey': Config.SUPABASE_KEY,
            'Authorization': `Bearer ${Config.SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation',
        };
    },

    /**
     * 從 Supabase 取得所有文件（依建立時間降冪排序）
     * @returns {Promise<Array<Object>>} 原始 DB 資料列陣列
     * @throws {Error} API 請求失敗時拋出
     */
    async fetchAll() {
        const res = await fetch(
            `${Config.SUPABASE_URL}/rest/v1/documents?select=*&order=created_at.desc`,
            { headers: this._getHeaders() }
        );
        if (!res.ok) throw new Error(`API 請求失敗 (${res.status})`);
        return res.json();
    },

    /**
     * 新增一筆文件
     * @param {Object} payload 要寫入的資料物件
     * @returns {Promise<Object>} 已建立的資料列
     * @throws {Error} 新增失敗時拋出
     */
    async insert(payload) {
        const res = await fetch(
            `${Config.SUPABASE_URL}/rest/v1/documents`,
            { method: 'POST', headers: this._getHeaders(), body: JSON.stringify(payload) }
        );
        if (!res.ok) throw new Error(`新增資料失敗 (${res.status})`);
        return res.json();
    },

    /**
     * 更新指定 id 的文件
     * @param {number|string} id 文件的資料庫 ID
     * @param {Object} payload 要更新的欄位
     * @returns {Promise<Object>} 已更新的資料列
     * @throws {Error} 更新失敗時拋出
     */
    async update(id, payload) {
        const res = await fetch(
            `${Config.SUPABASE_URL}/rest/v1/documents?id=eq.${id}`,
            { method: 'PATCH', headers: this._getHeaders(), body: JSON.stringify(payload) }
        );
        if (!res.ok) throw new Error(`更新資料失敗 (${res.status})`);
        return res.json();
    },

    /**
     * 刪除指定 id 的文件
     * @param {number|string} id 文件的資料庫 ID
     * @returns {Promise<void>}
     * @throws {Error} 刪除失敗時拋出
     */
    async remove(id) {
        const res = await fetch(
            `${Config.SUPABASE_URL}/rest/v1/documents?id=eq.${id}`,
            { method: 'DELETE', headers: this._getHeaders() }
        );
        if (!res.ok) throw new Error(`刪除資料失敗 (${res.status})`);
    },
};

/* ══════════════════════════════════════════════════
   Auth — 管理員身份驗證
   ══════════════════════════════════════════════════ */
const Auth = {
    /**
     * 開啟密碼輸入 Modal
     */
    openModal() {
        const modal = document.getElementById('password-modal');
        modal.style.display = 'flex';
        const input = document.getElementById('modal-password-input');
        input.value = '';
        document.getElementById('password-error-msg').classList.add('hidden');
        input.focus();
    },

    /** 關閉密碼 Modal */
    closeModal() {
        document.getElementById('password-modal').style.display = 'none';
    },

    /**
     * 驗證輸入密碼並切換管理員模式。
     * 成功後將 Session 寫入 localStorage（含到期時間戳）。
     *
     * @returns {boolean} 驗證是否通過
     *
     * ⚠️ 此為前端明碼比對，僅提供 UI 層保護。
     * 正式環境請替換為 Supabase Auth 的 signInWithPassword()。
     */
    verify() {
        const input = document.getElementById('modal-password-input').value;
        if (input === Config.ADMIN_PASSWORD) {
            State.isAdmin = true;
            this._saveSession();
            this.closeModal();
            UI.Render.updateAuthUI();
            UI.Toast.show('success', '已進入管理員模式');
            if (State.currentSelectedIndex !== null) {
                UI.Render.showDetail(State.currentSelectedIndex);
            }
            return true;
        }
        document.getElementById('password-error-msg').classList.remove('hidden');
        return false;
    },

    /** 登出管理員模式，並清除 localStorage Session 標記 */
    logout() {
        State.isAdmin = false;
        this._clearSession();
        UI.Render.updateAuthUI();
        UI.Toast.show('info', '已登出管理員模式');
        if (State.currentSelectedIndex !== null) {
            const doc = State.filteredDocuments[State.currentSelectedIndex];
            if (doc) UI.Render.renderDetail(doc, true);
        }
        const adminFormSection = document.getElementById('admin-form-section');
        if (adminFormSection) adminFormSection.classList.add('hidden');
        const saveBtnWrap = document.getElementById('save-basic-wrap');
        if (saveBtnWrap) saveBtnWrap.remove();
    },

    /**
     * 頁面初始化時呼叫：讀取 localStorage，若 Session 存在且未過期，
     * 自動恢復管理員狀態，省去重新輸入密碼的步驟。
     *
     * 此方法應在 DOMContentLoaded 的最前面呼叫（UI 組件已掛載後）。
     *
     * @returns {boolean} 是否成功恢復 Session
     */
    restoreSession() {
        try {
            const raw = localStorage.getItem(Config.SESSION_KEY);
            if (!raw) return false;

            const session = JSON.parse(raw);
            const now = Date.now();

            // 格式驗證：必須包含 expiresAt 欄位且尚未過期
            if (!session?.expiresAt || now >= session.expiresAt) {
                // 已過期或格式不符，主動清除殘留標記
                this._clearSession();
                return false;
            }

            // Session 有效：靜默恢復登入狀態
            State.isAdmin = true;
            UI.Render.updateAuthUI();
            return true;
        } catch {
            // JSON.parse 失敗或其他例外：清除損毀的標記
            this._clearSession();
            return false;
        }
    },

    /**
     * 將 Session 資訊寫入 localStorage。
     * 記錄登入時間與到期時間，供 restoreSession() 驗證使用。
     * @private
     */
    _saveSession() {
        try {
            const session = {
                loggedInAt: Date.now(),
                expiresAt:  Date.now() + Config.SESSION_TTL_MS,
            };
            localStorage.setItem(Config.SESSION_KEY, JSON.stringify(session));
        } catch (e) {
            // localStorage 不可用（隱私模式或容量已滿）時靜默失敗
            console.warn('[Auth._saveSession] localStorage 不可用：', e);
        }
    },

    /**
     * 從 localStorage 移除 Session 標記。
     * @private
     */
    _clearSession() {
        try {
            localStorage.removeItem(Config.SESSION_KEY);
        } catch (e) {
            console.warn('[Auth._clearSession] localStorage 不可用：', e);
        }
    },
};

/* ══════════════════════════════════════════════════
   UI — 所有 DOM 操作集中於此
   ══════════════════════════════════════════════════ */
const UI = {

    /* ── Toast 通知系統 ── */
    Toast: {
        /**
         * 顯示 Toast 通知
         * @param {'success'|'error'|'warning'|'info'} type 通知類型
         * @param {string} message 通知訊息
         */
        show(type, message) {
            const container = document.getElementById('toast-container');
            const styles = {
                success: { bg: 'bg-green-600',  icon: 'fa-circle-check' },
                error:   { bg: 'bg-red-600',    icon: 'fa-circle-xmark' },
                warning: { bg: 'bg-amber-500',  icon: 'fa-triangle-exclamation' },
                info:    { bg: 'bg-indigo-600', icon: 'fa-circle-info' },
            };
            const s = styles[type] || styles.info;

            const el = document.createElement('div');
            el.className = `toast-enter pointer-events-auto ${s.bg} text-white text-sm font-medium px-4 py-3 rounded-lg shadow-lg flex items-center gap-2`;
            el.innerHTML = `<i class="fa-solid ${s.icon}"></i><span>${message}</span>`;
            container.appendChild(el);

            // 自動移除
            const dismiss = () => {
                el.classList.remove('toast-enter');
                el.classList.add('toast-leave');
                el.addEventListener('animationend', () => el.remove(), { once: true });
            };
            setTimeout(dismiss, Config.TOAST_DURATION_MS);
        },
    },

    /* ── Loading 狀態控制 ── */
    Loading: {
        /**
         * 切換全域 Loading 指示器
         * @param {boolean} show
         */
        setGlobal(show) {
            const el = document.getElementById('global-loading');
            if (el) el.style.display = show ? 'flex' : 'none';
        },

        /**
         * 切換特定按鈕的 Loading 狀態
         * @param {HTMLElement} btn 目標按鈕元素
         * @param {boolean} loading
         */
        setButton(btn, loading) {
            if (!btn) return;
            btn.classList.toggle('btn-loading', loading);
        },
    },

    /* ── DOM 渲染邏輯 ── */
    Render: {
        /**
         * 計算統計數字（純函數，不操作 DOM）
         * @param {Array<Object>} docs
         * @returns {{ total: number, pending: number, approved: number, rejected: number }}
         */
        /**
         * 計算統計數字（純函數，不操作 DOM）
         *
         * pending（審核中）採用「非結案、非用印即視為審核中」的判斷方式，
         * 確保 total 永遠等於 pending + approved + rejected + stamping，
         * 「用印中」與「送用印」皆計入 stamping；其餘未結案狀態歸入 pending。
         *
         * @param {Array<Object>} docs
         * @returns {{ total: number, pending: number, approved: number, rejected: number, stamping: number }}
         */
        _calcStats(docs) {
            return docs.reduce((acc, doc) => {
                acc.total++;
                const bucket = Utils.getStatusBucket(doc.status);
                if (bucket === 'approved')  acc.approved++;
                else if (bucket === 'rejected')  acc.rejected++;
                else if (bucket === 'stamping')  acc.stamping++;
                else acc.pending++; // 涵蓋「審核中」等所有未結案且非用印狀態
                return acc;
            }, { total: 0, pending: 0, approved: 0, rejected: 0, stamping: 0 });
        },

        /**
         * 取得狀態對應的 Tailwind CSS class 字串
         * @param {string} status
         * @returns {string}
         */
        _getStatusClass(status) {
            if (status === Config.TERMINAL_STATUSES.APPROVED) return 'bg-green-100 text-green-800';
            if (status === Config.TERMINAL_STATUSES.REJECTED) return 'bg-red-100 text-red-800';
            if (status === '用印中' || status === '送用印') return 'bg-purple-100 text-purple-700';
            if (Config.STAGE_AS_STATUS.includes(status)) return 'bg-blue-100 text-blue-800';
            return 'bg-amber-100 text-amber-800';
        },

        /**
         * 建立單一列表行的 <tr> 元素（DocumentFragment 方式，避免重複 reflow）
         * @param {Object} doc 文件資料
         * @param {number} index filteredDocuments 中的索引
         * @returns {HTMLTableRowElement}
         */
        _buildTableRow(doc, index) {
            const tr = document.createElement('tr');
            const isSelected = State.currentSelectedIndex === index;
            tr.className = `hover:bg-indigo-50/50 cursor-pointer transition ${isSelected ? 'bg-indigo-50' : ''}`;
            tr.addEventListener('click', () => App.selectDocument(index));

            const content = doc.content || '無詳細說明';
            const statusClass = this._getStatusClass(doc.status);

            // 使用 textContent 設定文字，避免 XSS 注入
            const idCell    = document.createElement('td');
            idCell.className = 'px-6 py-4 max-w-xs';
            idCell.innerHTML = `
                <div class="font-mono text-xs text-gray-400">#ID-${doc.id ?? ''}</div>
                <div class="font-medium text-gray-900 truncate"></div>
                <div class="text-xs text-gray-400 mt-1 bg-gray-50 p-1.5 rounded border-l border-gray-300 line-clamp-2"></div>
            `;
            // 安全設定文字（防止 XSS）
            idCell.querySelector('.font-medium').textContent = doc.title ?? '';
            idCell.querySelector('.line-clamp-2').textContent = content;

            const applicantCell = document.createElement('td');
            applicantCell.className = 'px-6 py-4 text-gray-600';
            applicantCell.innerHTML = `<span></span><br><span class="text-xs text-gray-400"></span>`;
            applicantCell.querySelectorAll('span')[0].textContent = doc.applicant ?? '';
            applicantCell.querySelectorAll('span')[1].textContent = doc.dept ?? '';

            const stepCell = document.createElement('td');
            stepCell.className = 'px-6 py-4 font-medium text-gray-700';
            stepCell.textContent = doc.currentStep ?? '';

            const statusCell = document.createElement('td');
            statusCell.className = 'px-6 py-4';
            statusCell.innerHTML = `<span class="px-2.5 py-1 text-xs font-semibold rounded-full ${statusClass}"></span>`;
            statusCell.querySelector('span').textContent = doc.status ?? '';

            const dateCell = document.createElement('td');
            dateCell.className = 'px-6 py-4 text-xs text-gray-400';
            dateCell.textContent = doc.updatedAt ?? '';

            tr.append(idCell, applicantCell, stepCell, statusCell, dateCell);
            return tr;
        },

        /**
         * 渲染整個列表與統計數字（使用 DocumentFragment 批次更新 DOM）
         * 支援分頁：依 State.currentPage 與 State.pageSize 截取資料
         */
        renderList() {
            const listBody = document.getElementById('document-list-body');
            if (!listBody) return;

            const stats = this._calcStats(State.allDocuments);
            document.getElementById('count-total').textContent    = stats.total;
            document.getElementById('count-pending').textContent   = stats.pending;
            document.getElementById('count-approved').textContent  = stats.approved;
            document.getElementById('count-rejected').textContent  = stats.rejected;
            document.getElementById('count-stamping').textContent  = stats.stamping;

            const total = State.filteredDocuments.length;

            // 更新篩選結果數量提示
            const countEl = document.getElementById('filter-result-count');
            if (countEl) {
                const hasFilter = State.currentYear || State.currentMonth ||
                    document.getElementById('search-input')?.value.trim() ||
                    (State.filterStatus && State.filterStatus !== 'all');
                countEl.textContent = hasFilter ? `共 ${total} 筆符合條件` : '';
            }

            if (total === 0) {
                listBody.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-gray-400">目前無符合條件的簽呈資料。</td></tr>';
                document.getElementById('pagination-bar')?.classList.add('hidden');
                return;
            }

            // 計算分頁範圍
            const totalPages = Math.ceil(total / State.pageSize);
            // 邊界修正：若篩選後頁數減少，自動拉回最後一頁
            if (State.currentPage > totalPages) State.currentPage = totalPages;
            const startIdx = (State.currentPage - 1) * State.pageSize;
            const endIdx   = Math.min(startIdx + State.pageSize, total);
            const pageSlice = State.filteredDocuments.slice(startIdx, endIdx);

            // 用 DocumentFragment 一次性插入，減少 reflow 次數
            const fragment = document.createDocumentFragment();
            pageSlice.forEach((doc, sliceIdx) => {
                if (doc) {
                    // 傳入 filteredDocuments 中的真實索引，確保點選後 selectDocument 索引正確
                    fragment.appendChild(this._buildTableRow(doc, startIdx + sliceIdx));
                }
            });

            listBody.innerHTML = '';
            listBody.appendChild(fragment);

            // 渲染分頁列
            this._renderPagination(total, totalPages);
        },

        /**
         * 渲染分頁控制列
         * @param {number} total 總筆數
         * @param {number} totalPages 總頁數
         */
        _renderPagination(total, totalPages) {
            const bar = document.getElementById('pagination-bar');
            if (!bar) return;

            if (totalPages <= 1) {
                bar.classList.add('hidden');
                return;
            }
            bar.classList.remove('hidden');

            const cur = State.currentPage;
            const startItem = (cur - 1) * State.pageSize + 1;
            const endItem   = Math.min(cur * State.pageSize, total);

            // 更新資訊文字
            const infoEl = document.getElementById('pagination-info');
            if (infoEl) infoEl.textContent = `第 ${startItem}–${endItem} 筆，共 ${total} 筆`;

            // 頁碼按鈕：顯示目前頁附近最多 5 頁
            const numbersEl = document.getElementById('page-numbers');
            if (numbersEl) {
                numbersEl.innerHTML = '';
                const range = this._calcPageRange(cur, totalPages);
                range.forEach(p => {
                    if (p === '…') {
                        const span = document.createElement('span');
                        span.textContent = '…';
                        span.className = 'px-1.5 text-gray-400 text-xs';
                        numbersEl.appendChild(span);
                    } else {
                        const btn = document.createElement('button');
                        btn.textContent = p;
                        btn.className = `px-2.5 py-1 text-xs rounded border transition ${
                            p === cur
                                ? 'bg-indigo-600 text-white border-indigo-600 font-bold'
                                : 'border-gray-300 bg-white hover:bg-gray-100 text-gray-600'
                        }`;
                        btn.addEventListener('click', () => App.goToPage(p));
                        numbersEl.appendChild(btn);
                    }
                });
            }

            // 更新首/上/下/末頁按鈕的 disabled 狀態
            const setDisabled = (id, disabled) => {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = disabled;
            };
            setDisabled('page-first-btn', cur === 1);
            setDisabled('page-prev-btn',  cur === 1);
            setDisabled('page-next-btn',  cur === totalPages);
            setDisabled('page-last-btn',  cur === totalPages);
        },

        /**
         * 計算要顯示的頁碼列表（含省略號）
         * @param {number} cur 目前頁
         * @param {number} total 總頁數
         * @returns {Array<number|string>}
         */
        _calcPageRange(cur, total) {
            if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
            const pages = [];
            pages.push(1);
            if (cur > 3) pages.push('…');
            for (let p = Math.max(2, cur - 1); p <= Math.min(total - 1, cur + 1); p++) {
                pages.push(p);
            }
            if (cur < total - 2) pages.push('…');
            pages.push(total);
            return pages;
        },

        /**
         * 渲染右側詳情面板
         *
         * 日期欄位初始化原則：
         *   - 只有在「切換到不同文件」時才重設日期為今日，
         *     讓管理員在同一份文件上選好的日期不會被覆蓋。
         *   - 同文件的多次 re-render（例如 loadDocuments 後刷新）
         *     保留管理員已輸入的日期值，不予覆蓋。
         *
         * @param {Object} doc         文件資料
         * @param {boolean} isNewDoc   是否為切換到新文件（true = 重設表單；false = 保留現有輸入）
         */
        renderDetail(doc, isNewDoc = false) {
            const detailSection = document.getElementById('detail-section');
            detailSection.classList.remove('hidden');

            // ── 基本欄位渲染（管理員：可編輯 / 訪客：純文字）──
            document.getElementById('detail-id').textContent = `#ID-${doc.id ?? ''}`;

            const badge = document.getElementById('detail-status-badge');
            badge.textContent = doc.status ?? '';
            badge.className = `px-2 py-1 text-xs font-semibold rounded-full ${this._getStatusClass(doc.status)}`;

            // ✅ 刪除按鈕僅在管理員模式下顯示
            const deleteBtn = document.getElementById('delete-doc-btn');
            if (deleteBtn) deleteBtn.classList.toggle('hidden', !State.isAdmin);

            if (State.isAdmin) {
                // ── 管理員：切換為可編輯欄位（isNewDoc 時重建，避免殘留舊文件值）──
                if (isNewDoc) {
                    this._renderDetailEditableFields(doc);
                } else {
                    // 同一份文件重新渲染（如歷程儲存後 reload）：只更新值，不重建 DOM
                    const t = document.getElementById('detail-title-input');
                    const a = document.getElementById('detail-applicant-input');
                    const d = document.getElementById('detail-dept-input');
                    const c = document.getElementById('detail-content-input');
                    if (t) t.value = doc.title ?? '';
                    if (a) a.value = doc.applicant ?? '';
                    if (d) d.value = doc.dept ?? '';
                    if (c) c.value = doc.content ?? '';
                }
            } else {
                // ── 訪客：純文字（XSS 安全：全用 textContent）──
                // 若曾進入管理員模式，input 可能已取代 h3；統一用 id 查找，不存在時不報錯
                const titleNode = document.getElementById('detail-title') || document.getElementById('detail-title-input');
                if (titleNode) titleNode.textContent = doc.title ?? '';

                // 資訊列：若 infoBox 已被改寫為 input 群組，重建為靜態文字
                const infoBox = document.querySelector('#detail-section .bg-indigo-50, #detail-section .bg-gray-50');
                if (infoBox) {
                    infoBox.className = 'text-xs text-gray-600 mb-4 bg-gray-50 p-3 rounded-lg space-y-1';
                    infoBox.innerHTML = '';
                    const p1 = document.createElement('p');
                    const p2 = document.createElement('p');
                    // ✅ 全程 textContent，無 innerHTML 插值，防 XSS
                    p1.innerHTML = '<strong>申請人：</strong>';
                    const spanApp  = document.createElement('span'); spanApp.id  = 'detail-applicant'; spanApp.textContent = doc.applicant ?? '--';
                    const spanDept = document.createElement('span'); spanDept.id = 'detail-dept';      spanDept.textContent = `(${doc.dept ?? '--'})`;
                    p1.append(spanApp, ' ', spanDept);
                    p2.innerHTML = '<strong>事由：</strong>';
                    const spanCont = document.createElement('span'); spanCont.id = 'detail-content';   spanCont.textContent = doc.content || '無詳細說明';
                    p2.append(spanCont);
                    infoBox.append(p1, p2);
                }
            }

            // ── 管理員審核操作面板（已移除，略過）──

            this.renderTimeline(doc);
        },

        /**
         * 在詳情面板將基本欄位替換為可編輯 input/textarea（管理員專用）
         * 同時注入「儲存簽呈資訊」按鈕
         * @param {Object} doc
         */
        _renderDetailEditableFields(doc) {
            // ── 主旨：h3#detail-title → input ──
            const titleEl = document.getElementById('detail-title');
            if (titleEl) {
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.id   = 'detail-title-input';
                inp.value = doc.title ?? '';
                inp.className = 'font-bold text-gray-800 text-base w-full border-b border-dashed border-gray-300 bg-transparent focus:outline-none focus:border-indigo-500 py-0.5';
                inp.placeholder = '簽呈主旨';
                titleEl.replaceWith(inp);
            }

            // ── 資訊列：把靜態 <p> 換成 input 欄位群組 ──
            const infoBox = document.querySelector('#detail-section .bg-gray-50');
            if (infoBox) {
                infoBox.innerHTML = '';   // 清除靜態 <p> 文字，重建為 input 群組
                infoBox.className = 'text-xs mb-4 bg-indigo-50 border border-indigo-100 p-3 rounded-lg space-y-2';

                const mkField = (labelText, id, value, placeholder) => {
                    const wrap  = document.createElement('div');
                    wrap.className = 'flex items-center gap-2';
                    const label = document.createElement('label');
                    label.htmlFor = id;
                    label.className = 'font-semibold text-gray-600 w-16 shrink-0';
                    label.textContent = labelText;   // ✅ textContent 防 XSS
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.id   = id;
                    inp.value = value;               // ✅ .value 賦值防 XSS
                    inp.placeholder = placeholder;
                    inp.className = 'flex-1 border-b border-dashed border-indigo-200 bg-transparent focus:outline-none focus:border-indigo-500 text-gray-700 py-0.5';
                    wrap.append(label, inp);
                    return wrap;
                };

                const mkTextarea = (labelText, id, value, placeholder) => {
                    const wrap  = document.createElement('div');
                    wrap.className = 'flex items-start gap-2';
                    const label = document.createElement('label');
                    label.htmlFor = id;
                    label.className = 'font-semibold text-gray-600 w-16 shrink-0 pt-0.5';
                    label.textContent = labelText;   // ✅ textContent 防 XSS
                    const ta = document.createElement('textarea');
                    ta.id   = id;
                    ta.rows = 2;
                    ta.value = value;                // ✅ .value 賦值防 XSS
                    ta.placeholder = placeholder;
                    ta.className = 'flex-1 border border-dashed border-indigo-200 rounded bg-white focus:outline-none focus:border-indigo-500 text-gray-700 text-xs px-1.5 py-1 resize-none';
                    wrap.append(label, ta);
                    return wrap;
                };

                infoBox.append(
                    mkField('申請人：', 'detail-applicant-input', doc.applicant ?? '', '申請人姓名'),
                    mkField('部門：',   'detail-dept-input',      doc.dept ?? '',      '申請部門'),
                    mkTextarea('事由：', 'detail-content-input',  doc.content ?? '',   '簽呈內容說明'),
                );
            }

            // ── 儲存簽呈資訊按鈕（只注入一次）──
            if (!document.getElementById('save-basic-btn')) {
                const timelineContainer = document.getElementById('timelineContainer');
                const timelineHeading   = timelineContainer?.previousElementSibling;
                const insertTarget      = timelineHeading ?? timelineContainer;
                if (insertTarget) {
                    const btnWrap = document.createElement('div');
                    btnWrap.id = 'save-basic-wrap';
                    btnWrap.className = 'px-0 pb-3 pt-1';
                    btnWrap.innerHTML = `
                        <button id="save-basic-btn"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span id="save-basic-btn-text">儲存簽呈資訊</span>
                        </button>`;
                    insertTarget.parentNode.insertBefore(btnWrap, insertTarget);

                    document.getElementById('save-basic-btn').addEventListener('click', async () => {
                        const btn      = document.getElementById('save-basic-btn');
                        const btnText  = document.getElementById('save-basic-btn-text');
                        const titleVal = document.getElementById('detail-title-input')?.value.trim()     ?? '';
                        const appVal   = document.getElementById('detail-applicant-input')?.value.trim() ?? '';
                        const deptVal  = document.getElementById('detail-dept-input')?.value.trim()      ?? '';
                        const contVal  = document.getElementById('detail-content-input')?.value.trim()   ?? '';

                        if (!titleVal) {
                            UI.Toast.show('error', '簽呈主旨不可為空');
                            return;
                        }

                        btn.disabled  = true;
                        btnText.textContent = '儲存中…';
                        btn.querySelector('i').className = 'fa-solid fa-circle-notch animate-spin';

                        try {
                            // 取得當前文件
                            const doc = State.filteredDocuments[State.currentSelectedIndex];
                            if (!doc) throw new Error('找不到當前文件');

                            // 更新欄位
                            doc.title     = titleVal;
                            doc.applicant = appVal;
                            doc.dept      = deptVal;
                            doc.content   = contVal;

                            // ✅ 統一透過 App.updateDocument 寫回雲端、同步 State 並重繪總表
                            await App.updateDocument(doc);
                            UI.Toast.show('success', '簽呈資訊已儲存');
                        } catch (err) {
                            UI.Toast.show('error', `儲存失敗：${err.message}`);
                        } finally {
                            btn.disabled = false;
                            btnText.textContent = '儲存簽呈資訊';
                            btn.querySelector('i').className = 'fa-solid fa-floppy-disk';
                        }
                    });
                }
            }
        },

        /**
         * 渲染簽核歷程時間軸
         * 管理員模式：完整行內編輯器（拖曳排序 / 編輯關卡+時間+說明 / 插入節點 / 刪除節點）
         * 訪客模式：純文字只讀
         * @param {Object} doc 文件資料
         */
        renderTimeline(doc) {
            const container = document.getElementById('timelineContainer');
            if (!container) return;

            if (!State.isAdmin) {
                // ── 訪客：純文字只讀 ──
                const history = Array.isArray(doc.history) ? doc.history : [];
                if (history.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm pl-2 py-4">尚無簽核歷程</p>';
                    return;
                }
                const frag = document.createDocumentFragment();
                history.forEach(node => {
                    const colorMap = { error: 'bg-red-500', pending: 'bg-amber-400' };
                    const color = colorMap[node.status] ?? 'bg-green-500';
                    const item = document.createElement('div');
                    item.className = 'flex gap-4 items-start relative pb-6';
                    item.innerHTML = `
                        <div class="absolute -left-[9px] w-4 h-4 rounded-full border-2 border-white ${color}"></div>
                        <div class="pl-4">
                            <p class="text-sm font-bold text-gray-800">${node.stage ?? ''}</p>
                            <p class="text-xs text-gray-500">${node.time ?? ''}</p>
                            <p class="text-xs text-gray-600 mt-1">${node.note ?? ''}</p>
                        </div>`;
                    frag.appendChild(item);
                });
                container.innerHTML = '';
                container.appendChild(frag);
                return;
            }

            // ── 管理員：完整編輯模式 ──
            // 工作副本（不直接動 doc.history，按「儲存」才寫入）
            if (!container._editHistory || container._editDocId !== doc.id) {
                container._editHistory = JSON.parse(JSON.stringify(doc.history ?? []));
                container._editDocId   = doc.id;
            }

            // ✅ 依 Config.WORKFLOW_STAGES 動態生成，新增關卡（如「送用印」）時自動納入建議清單
            // 若關卡本身即代表一種特殊狀態（Config.STAGE_AS_STATUS，例如「送用印」），
            // 則直接顯示關卡名稱本身，不加「審核中」字尾。
            const STAGES = [
                ...Config.WORKFLOW_STAGES.map(s => Config.STAGE_AS_STATUS.includes(s) ? s : `${s}審核中`),
                '審核中', Config.TERMINAL_STATUSES.APPROVED, Config.TERMINAL_STATUSES.REJECTED,
            ];

            const renderEditor = () => {
                container.innerHTML = '';

                const history = container._editHistory;

                // ── 頂部提示列 ──
                const hint = document.createElement('p');
                hint.className = 'text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded px-2 py-1 mb-3 flex items-center gap-1';
                hint.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> 編輯模式：可拖曳排序、修改欄位，完成後按「儲存歷程」';
                container.appendChild(hint);

                if (history.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'text-gray-400 text-sm pl-2 py-2';
                    empty.textContent = '尚無簽核歷程';
                    container.appendChild(empty);
                }

                // ── 各節點 ──
                history.forEach((node, idx) => {
                    const colorMap = { error: 'bg-red-500', pending: 'bg-amber-400' };
                    const color = colorMap[node.status] ?? 'bg-green-500';

                    const item = document.createElement('div');
                    item.className = 'relative pb-5 border border-dashed border-gray-300 rounded-lg p-2 mb-2 bg-white group';
                    item.draggable = true;
                    item.dataset.idx = idx;

                    // drag handle 顏色點
                    const handle = document.createElement('div');
                    handle.className = `w-3 h-3 rounded-full ${color} inline-block mr-2 cursor-grab active:cursor-grabbing`;
                    handle.title = '拖曳排序';

                    // 關卡名稱（可編輯 input，帶下拉建議）
                    const stageInput = document.createElement('input');
                    stageInput.type = 'text';
                    stageInput.value = node.stage ?? '';
                    stageInput.placeholder = '關卡名稱（如：法務審核中）';
                    stageInput.className = 'text-sm font-bold text-gray-800 border-b border-dashed border-gray-300 bg-transparent focus:outline-none focus:border-indigo-500 w-full mb-1';
                    stageInput.setAttribute('list', 'stage-suggestions'); // ✅ list 是 read-only getter，必須用 setAttribute
                    stageInput.addEventListener('input', () => { container._editHistory[idx].stage = stageInput.value; });

                    // 時間
                    const dateInput = document.createElement('input');
                    dateInput.type = 'date';
                    dateInput.value = node.time ?? '';
                    dateInput.className = 'text-xs text-indigo-600 border border-dashed border-indigo-200 rounded px-1 py-0.5 bg-transparent focus:outline-none focus:border-indigo-500 focus:bg-indigo-50';
                    dateInput.addEventListener('change', () => { container._editHistory[idx].time = dateInput.value; });

                    // 狀態選擇（顏色點）
                    const statusSel = document.createElement('select');
                    statusSel.className = 'text-xs border border-dashed border-gray-300 rounded px-1 py-0.5 bg-white ml-2 text-gray-600 focus:outline-none focus:border-indigo-400';
                    statusSel.title = '節點狀態（影響顏色）';
                    [['pending','● 進行中'],['','● 已完成'],['error','● 駁回/錯誤']].forEach(([val, label]) => {
                        const opt = document.createElement('option');
                        opt.value = val;
                        opt.textContent = label;
                        if ((node.status ?? '') === val) opt.selected = true;
                        statusSel.appendChild(opt);
                    });
                    statusSel.addEventListener('change', () => { container._editHistory[idx].status = statusSel.value || undefined; });

                    // 說明
                    const noteInput = document.createElement('input');
                    noteInput.type = 'text';
                    noteInput.value = node.note ?? '';
                    noteInput.placeholder = '說明（選填）';
                    noteInput.className = 'text-xs text-gray-600 border-b border-dashed border-gray-200 bg-transparent focus:outline-none focus:border-indigo-400 w-full mt-1';
                    noteInput.addEventListener('input', () => { container._editHistory[idx].note = noteInput.value; });

                    // 刪除按鈕
                    const delBtn = document.createElement('button');
                    delBtn.className = 'absolute top-1 right-1 text-xs text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition px-1';
                    delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    delBtn.title = '刪除此歷程節點';
                    delBtn.addEventListener('click', () => {
                        container._editHistory.splice(idx, 1);
                        renderEditor();
                    });

                    // 在此節點前插入
                    const insertBtn = document.createElement('button');
                    insertBtn.className = 'block text-xs text-indigo-400 hover:text-indigo-600 mb-1 transition';
                    insertBtn.innerHTML = '<i class="fa-solid fa-plus mr-1"></i>在此前插入節點';
                    insertBtn.addEventListener('click', () => {
                        container._editHistory.splice(idx, 0, { stage: '', time: Utils.todayString(), note: '', status: 'pending' });
                        renderEditor();
                    });

                    // 拖曳排序
                    item.addEventListener('dragstart', e => {
                        e.dataTransfer.setData('text/plain', idx);
                        item.classList.add('opacity-50');
                    });
                    item.addEventListener('dragend', () => item.classList.remove('opacity-50'));
                    item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('ring-2','ring-indigo-300'); });
                    item.addEventListener('dragleave', () => item.classList.remove('ring-2','ring-indigo-300'));
                    item.addEventListener('drop', e => {
                        e.preventDefault();
                        item.classList.remove('ring-2','ring-indigo-300');
                        const from = parseInt(e.dataTransfer.getData('text/plain'));
                        const to   = parseInt(item.dataset.idx);
                        if (from !== to) {
                            const arr = container._editHistory;
                            const [moved] = arr.splice(from, 1);
                            arr.splice(to, 0, moved);
                            renderEditor();
                        }
                    });

                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-1 flex-wrap';
                    row.append(handle, stageInput);

                    const row2 = document.createElement('div');
                    row2.className = 'flex items-center gap-1 mt-1';
                    row2.append(dateInput, statusSel);

                    item.append(insertBtn, row, row2, noteInput, delBtn);
                    container.appendChild(item);
                });

                // ── 末尾「新增節點」按鈕 ──
                const addBtn = document.createElement('button');
                addBtn.className = 'text-xs text-indigo-500 hover:text-indigo-700 border border-dashed border-indigo-300 hover:border-indigo-500 rounded-lg px-3 py-1.5 w-full mt-1 transition';
                addBtn.innerHTML = '<i class="fa-solid fa-plus mr-1"></i>新增歷程節點（末尾）';
                addBtn.addEventListener('click', () => {
                    container._editHistory.push({ stage: '', time: Utils.todayString(), note: '', status: 'pending' });
                    renderEditor();
                });

                // ── 儲存 / 放棄 按鈕列 ──
                const btnRow = document.createElement('div');
                btnRow.className = 'flex gap-2 mt-3';

                const saveBtn = document.createElement('button');
                saveBtn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-1.5 rounded transition flex items-center justify-center gap-1';
                saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 儲存歷程';
                saveBtn.addEventListener('click', async () => {
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> 儲存中…';
                    try {
                        doc.history   = JSON.parse(JSON.stringify(container._editHistory));
                        const last    = doc.history[doc.history.length - 1];
                        if (last?.time) doc.updatedAt = last.time;

                        // ✅ 依最新歷程節點，回推並同步 currentStep / status，
                        //    確保總表的「當前關卡」「狀態」與時間軸最新節點一致
                        await App.updateDocument(doc, true);

                        UI.Toast.show('success', '簽核歷程已儲存');
                        container._editDocId = null; // 重置副本

                        // 重新從雲端載入，確保所有欄位完全同步
                        await App.loadDocuments();
                    } catch (err) {
                        UI.Toast.show('error', `儲存失敗：${err.message}`);
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 儲存歷程';
                    }
                });

                const discardBtn = document.createElement('button');
                discardBtn.className = 'flex-1 text-xs text-gray-500 hover:text-gray-700 border border-gray-300 hover:border-gray-400 py-1.5 rounded transition';
                discardBtn.innerHTML = '<i class="fa-solid fa-rotate-left mr-1"></i>放棄變更';
                discardBtn.addEventListener('click', () => {
                    container._editHistory = JSON.parse(JSON.stringify(doc.history ?? []));
                    renderEditor();
                });

                container.append(addBtn, btnRow);
                btnRow.append(saveBtn, discardBtn);

                // ── datalist 建議 ──
                if (!document.getElementById('stage-suggestions')) {
                    const dl = document.createElement('datalist');
                    dl.id = 'stage-suggestions';
                    STAGES.forEach(s => { const o = document.createElement('option'); o.value = s; dl.appendChild(o); });
                    document.body.appendChild(dl);
                }
            };

            renderEditor();
        },

        /**
         * 更新導覽列的管理員/訪客 UI 狀態
         */
        updateAuthUI() {
            const { isAdmin, currentSelectedIndex } = State;
            const formSection   = document.getElementById('admin-form-section');
            const authBtn       = document.getElementById('auth-btn');
            const roleBadge     = document.getElementById('role-badge');

            formSection.classList.toggle('hidden', !isAdmin);
            // ✅ 管理員登入時，確保送件日期欄位預設為今日
            if (isAdmin) {
                const submitDateEl = document.getElementById('form-submit-date');
                if (submitDateEl && !submitDateEl.value) {
                    submitDateEl.value = Utils.todayString();
                }
            }

            if (isAdmin) {
                authBtn.innerHTML = '<i class="fa-solid fa-lock-open mr-1"></i> 登出管理員';
                authBtn.className = 'text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition shadow-sm';
                roleBadge.textContent  = '最高管理員模式';
                roleBadge.className    = 'ml-2 px-2 py-0.5 text-xs bg-indigo-100 text-indigo-700 font-bold rounded';
            } else {
                authBtn.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> 管理員登入';
                authBtn.className = 'text-sm bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg transition';
                roleBadge.textContent  = '訪客唯讀模式';
                roleBadge.className    = 'ml-2 px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded';
            }
        },

        /**
         * 依 State.filterStatus 為對應的統計卡片加上選取樣式（ring + border），
         * 其餘卡片恢復預設樣式，提供「目前處於篩選模式」的視覺回饋。
         */
        updateStatsCardSelection() {
            const active = State.filterStatus || 'all';
            // 各篩選條件對應的 ring / border 顏色（與卡片本身的配色保持一致）
            // 卡片順序（左→右）：總簽呈數 / 審核中 / 被駁回 / 用印中 / 用印結案
            const ringColorMap = {
                all:      'ring-blue-500 border-blue-500',    // 總簽呈數（藍）
                pending:  'ring-amber-500 border-amber-500',  // 審核中（琥珀）
                rejected: 'ring-red-500 border-red-500',      // 被駁回（紅）
                stamping: 'ring-purple-500 border-purple-500',// 用印中（紫）
                approved: 'ring-green-500 border-green-500',  // 用印結案（綠）
            };
            const activeRing = ringColorMap[active] || 'ring-blue-500 border-blue-500';

            document.querySelectorAll('.stats-card').forEach(card => {
                const isActive = card.dataset.filter === active;
                // 先清除所有可能殘留的 ring / border 色彩 class
                card.classList.remove(
                    'ring-2',
                    'ring-blue-500',   'border-blue-500',
                    'ring-amber-500',  'border-amber-500',
                    'ring-green-500',  'border-green-500',
                    'ring-red-500',    'border-red-500',
                    'ring-purple-500', 'border-purple-500',
                );
                if (isActive) {
                    card.classList.add('ring-2', ...activeRing.split(' '));
                }
            });
        },

        /**
         * 依 Config.WORKFLOW_STAGES 動態產生「新增簽呈」表單的當前關卡選項。
         * 避免 HTML 寫死選項與 Config 設定不同步（例如新增「送用印」關卡時）。
         */
        populateStageOptions() {
            const select = document.getElementById('form-current-step');
            if (!select) return;

            const current = select.value;
            select.innerHTML = '';

            Config.WORKFLOW_STAGES.forEach((stage, idx) => {
                const opt = document.createElement('option');
                opt.value = stage;
                opt.textContent = stage;
                if (stage === current) {
                    opt.selected = true;
                } else if (!current && idx === 0) {
                    opt.selected = true; // 預設選取第一個關卡
                }
                select.appendChild(opt);
            });
        },

        /**
         * 顯示詳情面板（對外公開，由 App 呼叫）
         * @param {number} index
         */
        showDetail(index) {
            const doc = State.filteredDocuments[index];
            if (!doc) {
                document.getElementById('detail-section').classList.add('hidden');
                return;
            }
            // ✅ 判斷是否切換到不同文件：是則傳 isNewDoc=true，重設表單欄位（含日期預設今日）
            //    若是同一份文件的 re-render（例如狀態更新後刷新），則 isNewDoc=false，保留管理員輸入
            const isNewDoc = State.currentSelectedIndex !== index;
            State.currentSelectedIndex = index;
            this.renderDetail(doc, isNewDoc);
            // 重新渲染列表以更新選取樣式
            this.renderList();
        },
    },
};

/* ══════════════════════════════════════════════════
   Utils — 通用工具函數
   ══════════════════════════════════════════════════ */
const Utils = {
    /**
     * 取得今日的 YYYY-MM-DD 格式字串
     * @param {Date} [date=new Date()]
     * @returns {string}
     */
    todayString(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    },

    /**
     * 將 Supabase 回傳的 DB 資料列正規化為應用程式使用的文件物件。
     * 確保 DB 層的 id 與 created_at 不被 data 欄位內的同名欄位覆蓋。
     * @param {Object} row Supabase 回傳的原始資料列
     * @returns {Object|null}
     */
    normalizeDoc(row) {
        if (!row) return null;
        if (row.data && typeof row.data === 'object') {
            const merged = { ...row.data };
            merged.id         = row.id;
            merged.created_at = row.created_at;
            return merged;
        }
        return row;
    },

    /**
     * 簡易的非空字串驗證
     * @param {string} value
     * @returns {boolean}
     */
    isNonEmpty(value) {
        return typeof value === 'string' && value.trim().length > 0;
    },

    /**
     * 將文件的 status 歸類為統計卡片 / 狀態篩選使用的分類。
     * 與 UI.Render._calcStats 共用同一套規則：
     * 非「用印結案」「被駁回」「用印中」的所有狀態（包含「審核中」「送用印」等）皆歸為 'pending'。
     *
     * @param {string} status 文件的 status 欄位
     * @returns {'pending'|'approved'|'rejected'|'stamping'}
     */
    getStatusBucket(status) {
        const { APPROVED, REJECTED } = Config.TERMINAL_STATUSES;
        if (status === APPROVED)  return 'approved';
        if (status === REJECTED)  return 'rejected';
        // 「用印中」與「送用印」皆歸屬於 stamping 分類
        if (status === '用印中' || status === '送用印') return 'stamping';
        return 'pending';
    },
};

/* ══════════════════════════════════════════════════
   App — 高階商業邏輯
   ══════════════════════════════════════════════════ */
const App = {
    /**
     * 依「簽核歷程」最後一筆節點，回推並同步 doc.currentStep 與 doc.status。
     * 確保總表顯示的「當前關卡」「狀態」與時間軸最新節點完全一致。
     *
     * 判斷規則（由上至下，符合第一個條件即回傳）：
     *  1. 最後節點 stage（去除「審核中」字尾後）為結案狀態
     *     （Config.TERMINAL_STATUSES.APPROVED「用印結案」或 REJECTED「被駁回」）
     *       → currentStep = status = 該結案狀態文字
     *  2. 最後節點 stage（去除「審核中」字尾後）屬於 Config.STAGE_AS_STATUS
     *     （例如「送用印」）
     *       → currentStep = status = 該關卡名稱（「送用印」）
     *  3. 最後節點 stage（去除「審核中」字尾後）屬於 Config.WORKFLOW_STAGES 其他一般關卡
     *       → currentStep = 該關卡名稱，status = '審核中'
     *  4. 其他自訂備註類節點（不符合上述任何關卡名稱）
     *       → 不變更 currentStep / status
     *
     * @param {Object} doc 文件資料（會被直接修改）
     */
    syncStatusFromHistory(doc) {
        const history = Array.isArray(doc.history) ? doc.history : [];
        if (history.length === 0) return;

        const last = history[history.length - 1];
        const stage = (last?.stage ?? '').trim();
        if (!stage) return;

        // 去掉「審核中」字尾，取得純關卡 / 狀態名稱（例如「送用印審核中」→「送用印」）
        const SUFFIX = '審核中';
        const baseStage = stage.endsWith(SUFFIX) ? stage.slice(0, -SUFFIX.length) : stage;

        const { APPROVED, REJECTED } = Config.TERMINAL_STATUSES;

        // 1. 結案狀態：用印結案 / 被駁回 → 當前關卡與狀態皆顯示為該結案文字
        if (baseStage === APPROVED || baseStage === REJECTED) {
            doc.currentStep = baseStage;
            doc.status = baseStage;
            return;
        }

        // 2. 特殊關卡視為狀態：例如「送用印」 → 當前關卡與狀態皆顯示為「送用印」
        if (Config.STAGE_AS_STATUS.includes(baseStage)) {
            doc.currentStep = baseStage;
            doc.status = baseStage;
            return;
        }

        // 3. 一般審核關卡（財務部、法務、採購部、副總...）→ 狀態統一為「審核中」
        if (Config.WORKFLOW_STAGES.includes(baseStage)) {
            doc.currentStep = baseStage;
            doc.status = '審核中';
            return;
        }
        // 4. 其他自訂文字節點（如備註）→ 不影響 currentStep / status
    },

    /**
     * 集中處理單一文件的更新流程：
     *   1. 寫回雲端 API
     *   2. 同步 State.allDocuments / State.filteredDocuments 中對應的資料
     *   3. 觸發 UI.Render.renderList() 與（若該文件為目前選取項）UI.Render.renderDetail()
     *
     * 任何修改 doc 內容並需要寫回的流程，都應透過此方法統一處理，
     * 確保總表與詳情面板的「當前關卡」「狀態」即時保持一致。
     *
     * @param {Object} doc 已修改完成、待寫回的文件物件
     * @param {boolean} [syncStatus=false] 是否先依歷程回推 currentStep / status
     * @returns {Promise<void>}
     * @throws {Error} API 更新失敗時拋出，由呼叫端處理 Toast 顯示
     */
    async updateDocument(doc, syncStatus = false) {
        if (syncStatus) this.syncStatusFromHistory(doc);

        // 寫回雲端
        await Api.update(doc.id, { data: doc });

        // ✅ 同步 State 中的兩份資料陣列，確保總表立即反映最新值
        const allIdx = State.allDocuments.findIndex(d => d.id === doc.id);
        if (allIdx !== -1) State.allDocuments[allIdx] = doc;

        const filteredIdx = State.filteredDocuments.findIndex(d => d.id === doc.id);
        if (filteredIdx !== -1) State.filteredDocuments[filteredIdx] = doc;

        // ✅ 觸發總表重繪，使「當前關卡」「狀態」欄位即時更新
        UI.Render.renderList();

        // 若此文件正是目前選取的詳情面板，同步更新狀態徽章
        if (State.currentSelectedIndex !== null) {
            const cur = State.filteredDocuments[State.currentSelectedIndex];
            if (cur && cur.id === doc.id) {
                UI.Render.renderDetail(cur, false);
            }
        }
    },

    /**
     * 從雲端重新取得所有文件並刷新畫面
     * @param {boolean} [silent=false] 是否跳過 Loading 指示器
     */
    async loadDocuments(silent = false) {
        if (!silent) UI.Loading.setGlobal(true);
        try {
            const rows = await Api.fetchAll();
            State.allDocuments = Array.isArray(rows)
                ? rows.map(Utils.normalizeDoc).filter(Boolean)
                : [];
        } catch (err) {
            console.error('[App.loadDocuments]', err);
            UI.Toast.show('error', `資料載入失敗：${err.message}`);
            State.allDocuments = [];
        } finally {
            // 動態產生年份篩選選項
            this.populateYearFilter();
            // 套用目前搜尋條件後重新渲染
            this.applyFilter();
            if (!silent) UI.Loading.setGlobal(false);

            // 刷新已選取文件的詳情
            // ✅ isNewDoc=false：資料重載後不重設表單，管理員選好的日期完整保留
            if (State.currentSelectedIndex !== null) {
                const safeDoc = State.filteredDocuments[State.currentSelectedIndex];
                if (safeDoc) {
                    UI.Render.renderDetail(safeDoc, false);
                    UI.Render.renderList();
                } else {
                    UI.Render.showDetail(0);
                }
            } else {
                document.getElementById('detail-section').classList.add('hidden');
            }
        }
    },

    /**
     * 套用搜尋關鍵字 + 年月篩選，並重新渲染列表
     * 篩選條件改變時自動重置到第 1 頁
     * @param {boolean} [resetPage=true] 是否重置頁碼
     */
    applyFilter(resetPage = true) {
        if (resetPage) State.currentPage = 1;

        const keyword = document.getElementById('search-input')?.value.trim().toLowerCase() ?? '';
        const year    = State.currentYear;
        const month   = State.currentMonth;
        const statusFilter = State.filterStatus || 'all';

        State.filteredDocuments = State.allDocuments.filter(doc => {
            if (!doc) return false;

            // ── 統計卡片狀態篩選 ──
            if (statusFilter !== 'all' && Utils.getStatusBucket(doc.status) !== statusFilter) {
                return false;
            }

            // ── 年月篩選 ──
            if (year || month) {
                // 日期來源：updatedAt 或 created_at（字串格式 YYYY-MM-DD 或 ISO 8601）
                const dateStr = doc.updatedAt || doc.created_at || '';
                const datePart = dateStr.slice(0, 10); // 取 YYYY-MM-DD 部分
                if (datePart.length >= 7) {
                    const [docYear, docMonth] = datePart.split('-');
                    if (year  && docYear  !== year)          return false;
                    if (month && String(parseInt(docMonth)) !== month) return false;
                } else {
                    // 日期欄位缺失時，有篩選條件就排除
                    return false;
                }
            }

            // ── 關鍵字篩選 ──
            if (keyword) {
                return (
                    doc.applicant?.toLowerCase().includes(keyword) ||
                    doc.dept?.toLowerCase().includes(keyword)      ||
                    doc.title?.toLowerCase().includes(keyword)     ||
                    String(doc.id).includes(keyword)               ||
                    doc.content?.toLowerCase().includes(keyword)
                );
            }

            return true;
        });

        // 更新「清除篩選」按鈕可見性
