<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業簽呈進度追蹤系統 (Supabase 雲端正式版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fa-solid fa-file-signature text-indigo-600 text-2xl mr-3"></i>
                    <span class="text-xl font-bold text-gray-800">簽呈進度追蹤系統</span>
                    <span id="role-badge" class="ml-2 px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded">訪客唯讀模式</span>
                    <div id="global-loading" class="ml-4 flex items-center text-xs text-indigo-600 font-medium">
                        <i class="fa-solid fa-circle-notch animate-spin mr-1"></i> 雲端資料同步中...
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="auth-btn" onclick="handleAuthClick()" class="text-sm bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg transition">
                        <i class="fa-solid fa-lock mr-1"></i> 管理員登入
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center">
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg mr-4"><i class="fa-solid fa-list-check text-xl"></i></div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">總簽呈數</p>
                    <p id="count-total" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg mr-4"><i class="fa-solid fa-spinner text-xl animate-spin"></i></div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">審核中</p>
                    <p id="count-pending" class="text-2xl font-bold text-amber-600">0</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center">
                <div class="p-3 bg-green-50 text-green-600 rounded-lg mr-4"><i class="fa-solid fa-circle-check text-xl"></i></div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">已核准結案</p>
                    <p id="count-approved" class="text-2xl font-bold text-green-600">0</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center">
                <div class="p-3 bg-red-50 text-red-600 rounded-lg mr-4"><i class="fa-solid fa-circle-xmark text-xl"></i></div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">被駁回</p>
                    <p id="count-rejected" class="text-2xl font-bold text-red-600">0</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    
                    <div class="p-5 border-b border-gray-100 space-y-4 bg-gray-50">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-gray-800 flex items-center">
                                <i class="fa-solid fa-table-list mr-2 text-gray-500"></i> 簽呈進度總表
                            </h2>
                            <button onclick="fetchDataFromCloud()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium"><i class="fa-solid fa-arrows-rotate mr-1"></i> 手動整理</button>
                        </div>
                        
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                            <input type="text" id="search-input" oninput="filterDocuments()" placeholder="輸入申請人、部門、主旨或「內容說明」關鍵字搜尋..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-400 shadow-sm bg-white">
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-xs uppercase font-semibold">
                                    <th class="px-6 py-3 w-1/2">編號 / 主旨 / 內容說明</th>
                                    <th class="px-6 py-3">申請人</th>
                                    <th class="px-6 py-3">當前關卡</th>
                                    <th class="px-6 py-3">狀態</th>
                                    <th class="px-6 py-3">更新時間</th>
                                </tr>
                            </thead>
                            <tbody id="document-list-body" class="divide-y divide-gray-100 text-sm">
                                <tr>
                                    <td colspan="5" class="px-6 py-10 text-center text-gray-400">正在從雲端資料庫載入最新進度...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div id="admin-form-section" class="bg-white p-6 rounded-xl shadow-sm border-2 border-indigo-100 hidden">
                    <h2 class="font-bold text-gray-800 mb-4 flex items-center border-b pb-2">
                        <i class="fa-solid fa-feather-pointed mr-2 text-indigo-500"></i> 新增簽呈 (管理員專用)
                    </h2>
                    <form id="add-doc-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">簽呈主旨</label>
                            <input type="text" id="form-title" required placeholder="例如：採購辦公室電腦三台" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">申請人</label>
                                <input type="text" id="form-applicant" required placeholder="王大同" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">申請部門</label>
                                <input type="text" id="form-dept" required placeholder="資訊部" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">當前關卡</label>
                            <select id="form-current-step" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500 text-gray-700 font-medium">
                                <option value="部門主管" selected>部門主管</option>
                                <option value="法務">法務</option>
                                <option value="會計部">會計部</option>
                                <option value="採購部">採購部</option>
                                <option value="副總">副總</option>
                                <option value="5樓(執行長.董事長)">5樓(執行長.董事長)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">內容說明</label>
                            <textarea id="form-content" rows="3" placeholder="請輸入簽呈詳細事由..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500"></textarea>
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm flex justify-center items-center">
                            <i class="fa-solid fa-paper-plane mr-1"></i> 發布新簽呈到雲端
                        </button>
                    </form>
                </div>

                <div id="detail-section" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 hidden">
                    <div class="flex justify-between items-start border-b pb-3 mb-4">
                        <div>
                            <span id="detail-id" class="text-xs font-mono text-gray-400">#DOC-001</span>
                            <h3 id="detail-title" class="font-bold text-gray-800 text-base">簽呈主旨</h3>
                        </div>
                        <span id="detail-status-badge" class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">狀態</span>
                    </div>
                    
                    <div class="text-xs text-gray-600 mb-4 bg-gray-50 p-3 rounded-lg space-y-1">
                        <p><strong>申請人：</strong><span id="detail-applicant">--</span> (<span id="detail-dept">--</span>)</p>
                        <p><strong>事由：</strong><span id="detail-content">--</span></p>
                    </div>

                    <div id="admin-action-section" class="mb-5 rounded-lg border hidden">

                        <!-- ① 一般審核中模式 -->
                        <div id="action-normal-panel" class="p-3 bg-amber-50 border-amber-200 rounded-lg">
                            <p class="text-xs font-bold text-amber-800 mb-2"><i class="fa-solid fa-user-gear mr-1"></i> 管理員變更進度</p>
                            <div class="space-y-2 mb-3">
                                <div class="grid grid-cols-2 gap-2">
                                    <select id="action-stage" class="px-2 py-1.5 text-xs border border-gray-300 rounded bg-white font-medium text-gray-700 focus:outline-none focus:border-indigo-500">
                                        <option value="" disabled selected>選擇下個關卡</option>
                                        <option value="部門主管">部門主管</option>
                                        <option value="法務">法務</option>
                                        <option value="會計部">會計部</option>
                                        <option value="採購部">採購部</option>
                                        <option value="副總">副總</option>
                                        <option value="5樓(執行長.董事長)">5樓(執行長.董事長)</option>
                                    </select>
                                    <input type="date" id="action-date" class="px-2 py-1 text-xs border border-gray-300 rounded bg-white text-gray-700 focus:outline-none focus:border-indigo-500">
                                </div>
                                <input type="text" id="action-note" placeholder="簽核評語/意見、駁回理由 (選填)" class="w-full px-2 py-1.5 text-xs border border-gray-300 rounded bg-white">
                                <div class="flex gap-2 pt-1">
                                    <button onclick="updateDocStatus('審核中')" class="flex-1 bg-amber-500 text-white text-xs py-1.5 font-medium rounded hover:bg-amber-600 transition">送下一關</button>
                                    <button onclick="updateDocStatus('已核准')" class="flex-1 bg-green-600 text-white text-xs py-1.5 font-medium rounded hover:bg-green-700 transition">核准結案</button>
                                    <button onclick="updateDocStatus('被駁回')" class="flex-1 bg-red-600 text-white text-xs py-1.5 font-medium rounded hover:bg-red-700 transition">駁回</button>
                                </div>
                            </div>
                        </div>

                        <!-- ② 被駁回補正送審模式 -->
                        <div id="action-rejected-panel" class="p-3 bg-red-50 border-red-200 rounded-lg hidden">
                            <p class="text-xs font-bold text-red-700 mb-1 flex items-center gap-1">
                                <i class="fa-solid fa-rotate-left"></i> 此簽呈已被駁回 — 補正後重新送審
                            </p>
                            <p class="text-xs text-red-500 mb-3">選擇後續審核關卡後即可重新送審，補正說明可選填。</p>
                            <div class="space-y-2">
                                <textarea id="action-resubmit-note" rows="2"
                                    placeholder="補正說明（選填）：說明已修正的內容或理由..."
                                    class="w-full px-2 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                                <div class="grid grid-cols-2 gap-2">
                                    <select id="action-resubmit-stage" class="px-2 py-1.5 text-xs border border-gray-300 rounded bg-white font-medium text-gray-700 focus:outline-none focus:border-indigo-500">
                                        <option value="" disabled selected>選擇重新送審關卡</option>
                                        <option value="部門主管">部門主管</option>
                                        <option value="法務">法務</option>
                                        <option value="會計部">會計部</option>
                                        <option value="採購部">採購部</option>
                                        <option value="副總">副總</option>
                                        <option value="5樓(執行長.董事長)">5樓(執行長.董事長)</option>
                                    </select>
                                    <input type="date" id="action-resubmit-date" class="px-2 py-1 text-xs border border-gray-300 rounded bg-white text-gray-700 focus:outline-none focus:border-indigo-500">
                                </div>
                                <button onclick="resubmitRejectedDoc()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-2 font-bold rounded transition flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-paper-plane"></i> 確認補正，重新送審
                                </button>
                            </div>
                        </div>

                        <div class="border-t border-gray-200 pt-2 flex justify-end px-3 pb-2 mt-1">
                            <button onclick="deleteDocumentFromCloud()" class="text-xs text-red-600 hover:text-red-800 font-semibold bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition flex items-center">
                                <i class="fa-solid fa-trash-can mr-1"></i> 刪除此筆簽呈資料
                            </button>
                        </div>
                    </div>

                    <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-3">簽核歷程時間軸</h4>
                    <div id="timelineContainer" class="relative border-l-2 border-gray-200 ml-2 space-y-4 pb-2"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="password-modal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-sm p-6 mx-4">
            <div class="flex items-center mb-4 text-indigo-600">
                <i class="fa-solid fa-shield-halved text-2xl mr-2"></i>
                <h3 class="text-lg font-bold text-gray-800">管理員權限驗證</h3>
            </div>
            <p class="text-xs text-gray-500 mb-4">請輸入專屬暗號以啟用「新增與編輯明細」功能。</p>
            <div class="space-y-4">
                <div>
                    <input type="password" id="modal-password-input" placeholder="請輸入密碼" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    <p id="password-error-msg" class="text-xs text-red-500 mt-1 hidden">密碼錯誤，請重新輸入。</p>
                </div>
                <div class="flex gap-3 justify-end text-sm font-medium">
                    <button onclick="closePasswordModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg transition">取消</button>
                    <button onclick="verifyAdminPassword()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition shadow-sm">確認登入</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://arosasnpwfkaiaglocex.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyb3Nhc25wd2ZrYWlhZ2xvY2V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzU2MzcsImV4cCI6MjA5NjQxMTYzN30.0qBGNuyUTitC5fqlH2SAH4ZElm490ttcI8MmB4udDXM";
        const ADMIN_PASSWORD = "admin123";

        let allDocuments = [];
        let filteredDocuments = [];
        let isAdmin = false;
        let currentSelectedIndex = null;

        function getFormattedDateString(dateObj = new Date()) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
        }

        function setNowToDateInput() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const targetEl = document.getElementById('action-date');
            if (targetEl) targetEl.value = `${year}-${month}-${day}`;
        }

        // ── 雲端資料讀取 ──────────────────────────────────────────
        async function fetchDataFromCloud() {
            showLoading(true);
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/documents?select=*&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error("API 請求失敗");

                const dbData = await response.json();
                if (Array.isArray(dbData) && dbData.length > 0) {
                    allDocuments = dbData.map(item => {
                        if (item && item.data) {
                            // 先展開 data，再用外層真實的 id/created_at 覆蓋，避免 data 內的 id 欄位污染
                            const merged = { ...item.data };
                            merged.id         = item.id;          // 強制用 DB bigint id
                            merged.created_at = item.created_at;
                            return merged;
                        }
                        return item;
                    }).filter(Boolean);
                } else {
                    allDocuments = [];
                }

                filteredDocuments = [...allDocuments];
                renderSystem();

                if (currentSelectedIndex !== null && filteredDocuments.length > 0) {
                    const safeDoc = filteredDocuments[currentSelectedIndex];
                    if (safeDoc) {
                        showDetail(currentSelectedIndex);
                    } else {
                        showDetail(0);
                    }
                } else {
                    document.getElementById('detail-section').classList.add('hidden');
                }
            } catch (error) {
                console.error("雲端讀取失敗:", error);
                allDocuments = [];
                filteredDocuments = [];
                renderSystem();
            } finally {
                showLoading(false);
            }
        }

        function filterDocuments() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            if (!keyword) {
                filteredDocuments = [...allDocuments];
            } else {
                filteredDocuments = allDocuments.filter(doc => {
                    if (!doc) return false;
                    return (
                        (doc.applicant && doc.applicant.toLowerCase().includes(keyword)) ||
                        (doc.dept && doc.dept.toLowerCase().includes(keyword)) ||
                        (doc.title && doc.title.toLowerCase().includes(keyword)) ||
                        (String(doc.id).toLowerCase().includes(keyword)) ||
                        (doc.content && doc.content.toLowerCase().includes(keyword))
                    );
                });
            }
            renderSystem();
        }

        function showLoading(show) {
            const loadingEl = document.getElementById('global-loading');
            if (loadingEl) loadingEl.style.display = show ? 'flex' : 'none';
        }

        function handleAuthClick() {
            if (!isAdmin) {
                document.getElementById('password-modal').style.display = 'flex';
                document.getElementById('modal-password-input').value = '';
                document.getElementById('password-error-msg').classList.add('hidden');
                document.getElementById('modal-password-input').focus();
            } else {
                isAdmin = false;
                updateAuthUI();
                if (currentSelectedIndex !== null && filteredDocuments[currentSelectedIndex]) {
                    renderTimeline(filteredDocuments[currentSelectedIndex]);
                }
            }
        }

        function closePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
        }

        function verifyAdminPassword() {
            const inputPwd = document.getElementById('modal-password-input').value;
            if (inputPwd === ADMIN_PASSWORD) {
                isAdmin = true;
                closePasswordModal();
                updateAuthUI();
                if (currentSelectedIndex !== null && filteredDocuments[currentSelectedIndex]) {
                    renderTimeline(filteredDocuments[currentSelectedIndex]);
                }
            } else {
                document.getElementById('password-error-msg').classList.remove('hidden');
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const pwdInput = document.getElementById('modal-password-input');
            if (pwdInput) {
                pwdInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') verifyAdminPassword();
                });
            }

            // 重新送件 UI 顯示控制
            document.getElementById('action-stage').addEventListener('change', function () {
                const box = document.getElementById('resubmit-box');
                if (this.value === "重新送件") {
                    box.style.display = "block";
                } else {
                    box.style.display = "none";
                    const input = document.getElementById('action-resubmit-note');
                    if (input) input.value = "";
                }
            });
        });

        function updateAuthUI() {
            const formSection = document.getElementById('admin-form-section');
            const actionSection = document.getElementById('admin-action-section');
            const authBtn = document.getElementById('auth-btn');
            const roleBadge = document.getElementById('role-badge');

            if (isAdmin) {
                formSection.classList.remove('hidden');
                if (currentSelectedIndex !== null) {
                    actionSection.classList.remove('hidden');
                    setNowToDateInput();
                }
                authBtn.innerHTML = '<i class="fa-solid fa-lock-open mr-1"></i> 登出管理員';
                authBtn.className = "text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition shadow-sm";
                roleBadge.innerText = "最高管理員模式";
                roleBadge.className = "ml-2 px-2 py-0.5 text-xs bg-indigo-100 text-indigo-700 font-bold rounded";
            } else {
                formSection.classList.add('hidden');
                actionSection.classList.add('hidden');
                authBtn.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> 管理員登入';
                authBtn.className = "text-sm bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg transition";
                roleBadge.innerText = "訪客唯讀模式";
                roleBadge.className = "ml-2 px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded";
            }
        }

        function renderSystem() {
            const listBody = document.getElementById('document-list-body');
            if (!listBody) return;
            listBody.innerHTML = '';

            if (filteredDocuments.length === 0) {
                listBody.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-gray-400">目前雲端無簽呈資料，請登入管理員建立第一筆。</td></tr>';
                document.getElementById('count-total').innerText = 0;
                document.getElementById('count-pending').innerText = 0;
                document.getElementById('count-approved').innerText = 0;
                document.getElementById('count-rejected').innerText = 0;
                return;
            }

            let total = allDocuments.length, pending = 0, approved = 0, rejected = 0;
            allDocuments.forEach(doc => {
                if (!doc) return;
                if (doc.status === '審核中') pending++;
                else if (doc.status === '已核准') approved++;
                else if (doc.status === '被駁回') rejected++;
            });

            filteredDocuments.forEach((doc, index) => {
                if (!doc) return;
                let statusClass = "bg-amber-100 text-amber-800";
                if (doc.status === '已核准') statusClass = "bg-green-100 text-green-800";
                if (doc.status === '被駁回') statusClass = "bg-red-100 text-red-800";

                const displayContent = doc.content ? doc.content : "無詳細說明";

                const tr = document.createElement('tr');
                tr.className = `hover:bg-indigo-50/50 cursor-pointer transition ${currentSelectedIndex === index ? 'bg-indigo-50' : ''}`;
                tr.onclick = () => showDetail(index);
                tr.innerHTML = `
                    <td class="px-6 py-4 max-w-xs">
                        <div class="font-mono text-xs text-gray-400">#ID-${doc.id || ''}</div>
                        <div class="font-medium text-gray-900 truncate">${doc.title || ''}</div>
                        <div class="text-xs text-gray-400 mt-1 bg-gray-50 p-1.5 rounded border-l border-gray-300 line-clamp-2">${displayContent}</div>
                    </td>
                    <td class="px-6 py-4 text-gray-600">${doc.applicant || ''}<br><span class="text-xs text-gray-400">${doc.dept || ''}</span></td>
                    <td class="px-6 py-4 font-medium text-gray-700">${doc.currentStep || ''}</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full ${statusClass}">${doc.status || ''}</span></td>
                    <td class="px-6 py-4 text-xs text-gray-400">${doc.updatedAt || ''}</td>
                `;
                listBody.appendChild(tr);
            });

            document.getElementById('count-total').innerText = total;
            document.getElementById('count-pending').innerText = pending;
            document.getElementById('count-approved').innerText = approved;
            document.getElementById('count-rejected').innerText = rejected;
        }

        function showDetail(index) {
            if (filteredDocuments.length === 0 || filteredDocuments[index] === undefined) {
                document.getElementById('detail-section').classList.add('hidden');
                return;
            }

            currentSelectedIndex = index;
            const doc = filteredDocuments[index];
            if (!doc) return;

            document.getElementById('detail-section').classList.remove('hidden');
            if (isAdmin) {
                const actionSection = document.getElementById('admin-action-section');
                const normalPanel  = document.getElementById('action-normal-panel');
                const rejectedPanel = document.getElementById('action-rejected-panel');

                actionSection.classList.remove('hidden');

                if (doc.status === '被駁回') {
                    normalPanel.classList.add('hidden');
                    rejectedPanel.classList.remove('hidden');
                    const rdEl = document.getElementById('action-resubmit-date');
                    if (rdEl) rdEl.value = getFormattedDateString();
                    const rnEl = document.getElementById('action-resubmit-note');
                    if (rnEl) rnEl.value = '';
                    const rsEl = document.getElementById('action-resubmit-stage');
                    if (rsEl) rsEl.value = '';
                } else {
                    normalPanel.classList.remove('hidden');
                    rejectedPanel.classList.add('hidden');
                    document.getElementById('action-stage').value = "";
                    setNowToDateInput();
                }
            }

            document.getElementById('detail-id').innerText = `#ID-${doc.id || ''}`;
            document.getElementById('detail-title').innerText = doc.title || '';
            document.getElementById('detail-applicant').innerText = doc.applicant || '';
            document.getElementById('detail-dept').innerText = doc.dept || '';
            document.getElementById('detail-content').innerText = doc.content || "無詳細說明";

            const badge = document.getElementById('detail-status-badge');
            if (badge) {
                badge.innerText = doc.status || '';
                badge.className = `px-2 py-1 text-xs font-semibold rounded-full ${
                    doc.status === '已核准' ? 'bg-green-100 text-green-800' :
                    doc.status === '被駁回' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'
                }`;
            }

            renderTimeline(doc);
        }

        function renderTimeline(doc) {
            if (!doc) return;

            const safeDocId = doc.id;
            const timelineContainer = document.getElementById('timelineContainer');
            if (!timelineContainer) return;

            timelineContainer.innerHTML = '';

            let timelineData = doc.history || doc.timeline || [];

            if (!Array.isArray(timelineData) || timelineData.length === 0) {
                timelineContainer.innerHTML = '<p class="text-gray-400 text-sm pl-2 py-4">尚無簽核歷程</p>';
                return;
            }

            timelineData.forEach((node, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex gap-4 items-start relative pb-6";

                let formattedTimeForInput = (node.time || '').split(' ')[0];

                // 判斷節點類型
                const isRejected   = node.status === 'error' ||
                                     (node.stage && node.stage.includes('駁回'));
                const isResubmit   = node.status === 'resubmit' ||
                                     (node.stage && (node.stage.includes('補正') || node.stage.includes('重新送審') || node.stage.includes('重新送件')));
                const isPending    = node.status === 'pending';

                // 圓點顏色
                let dotColor = 'bg-green-500';
                if (isRejected)  dotColor = 'bg-red-500';
                else if (isResubmit) dotColor = 'bg-blue-500';
                else if (isPending)  dotColor = 'bg-amber-500 animate-pulse';

                // 卡片邊框與標題顏色
                let cardBorder  = 'border-gray-100';
                let stageCls    = 'text-gray-700';
                let noteHTML    = '';

                const noteText = node.note || node.comment || '';

                if (isRejected) {
                    cardBorder = 'border-red-200 bg-red-50';
                    stageCls   = 'text-red-600';
                    noteHTML   = `
                        <div class="mt-2 bg-white border border-red-200 rounded p-2 text-xs">
                            <span class="font-semibold text-red-700 flex items-center gap-1 mb-0.5">
                                <i class="fa-solid fa-circle-xmark"></i> 駁回意見
                            </span>
                            <span class="text-red-600 pl-4">${noteText || '（未填寫駁回理由）'}</span>
                        </div>`;
                } else if (isResubmit) {
                    cardBorder = 'border-blue-200 bg-blue-50';
                    stageCls   = 'text-blue-700';
                    noteHTML   = noteText
                        ? `<p class="text-xs mt-1 text-blue-600 bg-white border border-blue-100 rounded p-2 italic">「 ${noteText} 」</p>`
                        : `<p class="text-xs mt-1 text-gray-400 italic">（未填寫補正說明）</p>`;
                } else if (isPending) {
                    cardBorder = 'border-amber-200';
                    stageCls   = 'text-amber-700';
                    noteHTML   = `<p class="text-xs italic text-gray-400 mt-1">等待簽核中...</p>`;
                } else {
                    noteHTML = noteText
                        ? `<p class="text-xs italic text-gray-500 mt-1 bg-gray-50 p-2 rounded border-l-2 border-gray-300">「 ${noteText} 」</p>`
                        : `<p class="text-xs italic text-gray-400 mt-1">（無簽核意見）</p>`;
                }

                // 時間元件：管理員可編輯，一般用戶唯讀
                let timeComponentHTML = '';
                if (isAdmin && safeDocId) {
                    timeComponentHTML = `
                        <input type="date"
                               class="border border-gray-300 rounded px-2 py-0.5 text-xs bg-yellow-50 focus:bg-white text-gray-700 outline-none cursor-pointer shadow-sm"
                               value="${formattedTimeForInput}"
                               onchange="updateSingleTimelineTime(${safeDocId}, ${index}, this.value)">
                    `;
                } else {
                    timeComponentHTML = `<span class="text-gray-400 text-xs">${node.time || ''}</span>`;
                }

                itemDiv.innerHTML = `
                    <div class="flex flex-col items-center">
                        <div class="w-3 h-3 rounded-full border-2 border-white ${dotColor} mt-1.5 z-10 shadow-sm"></div>
                        ${index < timelineData.length - 1 ? `<div class="w-0.5 bg-gray-200 absolute top-4 bottom-0 left-1.5"></div>` : ''}
                    </div>
                    <div class="flex-1 p-3 rounded shadow-sm border ${cardBorder}">
                        <div class="flex justify-between items-center text-xs text-gray-400 mb-0.5 gap-4">
                            <span class="font-bold text-sm ${stageCls}">${node.stage || '處理步驟'}</span>
                            ${timeComponentHTML}
                        </div>
                        ${noteHTML}
                    </div>
                `;

                timelineContainer.appendChild(itemDiv);
            });
        }

        // ── 修改個別時間點並儲存至 Supabase ──────────────────────
        async function updateSingleTimelineTime(docId, timelineIndex, rawDateTimeInputValue) {
            if (!docId || !rawDateTimeInputValue) return;

            const cleanedDatabaseTimeStr = rawDateTimeInputValue;

            try {
                const docIndex = allDocuments.findIndex(d => d.id === docId);
                if (docIndex === -1) throw new Error("快取中找不到該筆簽呈。");

                let targetDocCopy = JSON.parse(JSON.stringify(allDocuments[docIndex]));

                if (targetDocCopy.history && targetDocCopy.history[timelineIndex]) {
                    targetDocCopy.history[timelineIndex].time = cleanedDatabaseTimeStr;
                } else if (targetDocCopy.timeline && targetDocCopy.timeline[timelineIndex]) {
                    targetDocCopy.timeline[timelineIndex].time = cleanedDatabaseTimeStr;
                } else {
                    throw new Error("找不到對應的時間軸節點索引。");
                }

                let cleanData = { ...targetDocCopy };
                delete cleanData.id;
                delete cleanData.created_at;

                const response = await fetch(`${SUPABASE_URL}/rest/v1/documents?id=eq.${docId}`, {
                    method: 'PATCH',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify(cleanData)
                });

                if (!response.ok) throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);

                const responseDataList = await response.json();

                allDocuments[docIndex] = {
                    ...responseDataList[0].data,
                    id: docId,                                    // 強制保留真實 DB id
                    created_at: allDocuments[docIndex].created_at
                };

                const filterIdx = filteredDocuments.findIndex(d => d.id === docId);
                if (filterIdx !== -1) filteredDocuments[filterIdx] = allDocuments[docIndex];

                console.log(`[雲端同步成功] 簽呈 ID #${docId} 節點修正為: ${cleanedDatabaseTimeStr}`);

            } catch (error) {
                console.error("修正失敗:", error);
                alert("無法成功更新時間軸，錯誤原因: " + error.message);
                fetchDataFromCloud();
            }
        }

        // ── 新增簽呈 ──────────────────────────────────────────────
        document.getElementById('add-doc-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> 上傳雲端中...';

            const title = document.getElementById('form-title').value;
            const applicant = document.getElementById('form-applicant').value;
            const dept = document.getElementById('form-dept').value;
            const currentStep = document.getElementById('form-current-step').value;
            const content = document.getElementById('form-content').value;
            const dateString = getFormattedDateString();

            const newDoc = {
                title: title,
                applicant: applicant,
                dept: dept,
                content: content,
                currentStep: currentStep,
                status: "審核中",
                updatedAt: dateString,
                history: [
                    {
                        time: dateString,
                        stage: "填單送出",
                        note: `新簽呈建立成功。申請人: ${applicant}(${dept})`,
                        status: "success"
                    },
                    {
                        time: dateString,
                        stage: `${currentStep}審核`,
                        note: "等待簽核中...",
                        status: "pending"
                    }
                ]
            };

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/documents`, {
                    method: 'POST',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ data: newDoc })
                });
                this.reset();
                document.getElementById('form-current-step').value = "部門主管";
                document.getElementById('search-input').value = '';
                currentSelectedIndex = 0;
                await fetchDataFromCloud();
            } catch (error) {
                alert("上傳雲端失敗，請稍後再試。");
            } finally {
                // ✅ 修正：無論成功或失敗都要恢復按鈕狀態
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> 發布新簽呈到雲端';
            }
        });

        // ── 補正重新送審（被駁回專用）────────────────────────────
        async function resubmitRejectedDoc() {
            if (currentSelectedIndex === null || !isAdmin) return;

            const doc = filteredDocuments[currentSelectedIndex];
            if (!doc || doc.status !== '被駁回') return;

            const resubmitNote  = document.getElementById('action-resubmit-note').value.trim();
            const resubmitStage = document.getElementById('action-resubmit-stage').value;
            const resubmitDate  = document.getElementById('action-resubmit-date').value;

            if (!resubmitStage) {
                alert("請選擇重新送審的目標關卡。");
                return;
            }

            const dateString = resubmitDate || getFormattedDateString();

            showLoading(true);

            if (!Array.isArray(doc.history)) doc.history = [];

            // 狀態先改好再存雲端
            doc.status      = '審核中';
            doc.currentStep = resubmitStage;
            doc.updatedAt   = dateString;

            doc.history.push({
                time:   dateString,
                stage:  '🔁 補正重新送審',
                note:   resubmitNote || '（未填寫補正說明）',
                status: 'resubmit'
            });
            doc.history.push({
                time:   dateString,
                stage:  `${resubmitStage} 審核中`,
                note:   '補正後重新進入審核流程',
                status: 'pending'
            });

            try {
                await saveToCloud(doc);
                // 記住目前選取的 doc id，重載後重新指向
                const selectedDocId = doc.id;
                await fetchDataFromCloud();
                // fetchDataFromCloud 後 filteredDocuments 已更新，重新定位
                const newIdx = filteredDocuments.findIndex(d => d && d.id === selectedDocId);
                if (newIdx !== -1) showDetail(newIdx);
            } catch (err) {
                console.error(err);
                alert("送審失敗，請稍後再試。");
            } finally {
                showLoading(false);
            }
        }

        // ── 審核狀態流轉 ──────────────────────────────────────────
       async function updateDocStatus(targetStatus) {
    if (currentSelectedIndex === null || !isAdmin) return;

    // 1. 獲取 UI 值
    const stageSelect = document.getElementById('action-stage').value;
    const dateInput = document.getElementById('action-date').value;
    const noteInput = document.getElementById('action-note').value.trim();

    const doc = filteredDocuments[currentSelectedIndex];
    if (!doc) return;

    // 2. 流程驗證
    if (targetStatus === '審核中' && !stageSelect) {
        alert("請選擇下一關卡");
        return;
    }

    showLoading(true);

    try {
        const chosenDate = dateInput ? dateInput : getFormattedDateString();
        
        // 確保 history 存在
        if (!Array.isArray(doc.history)) doc.history = [];

        // 添加本次處理紀錄
        doc.history.push({
            time: chosenDate,
            stage: targetStatus,
            note: noteInput || `${doc.currentStep || '當前關卡'} 處理完畢`,
            status: targetStatus === "被駁回" ? "error" : "success"
        });

        // 如果是審核中，添加下一關的待處理節點
        if (targetStatus === '審核中') {
            doc.currentStep = stageSelect;
            doc.history.push({
                time: chosenDate,
                stage: `${stageSelect}審核中`,
                note: "等待處理",
                status: "pending"
            });
        } else {
            // 已核准或駁回，清空當前關卡
            doc.status = targetStatus;
        }

        // 3. 準備存入資料
        const cleanData = { ...doc };
        delete cleanData.id;
        delete cleanData.created_at;

        // 4. 執行更新
        const response = await fetch(`${SUPABASE_URL}/rest/v1/documents?id=eq.${doc.id}`, {
            method: 'PATCH',
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=representation" // 強制回傳更新後的資料
            },
            body: JSON.stringify(cleanData)
        });

        if (!response.ok) throw new Error("資料庫更新失敗");

        // 5. 重新整理 UI
        await fetchDataFromCloud();
        alert("更新成功！");

    } catch (err) {
        console.error("更新錯誤:", err);
        alert("更新失敗，請查看 Console 錯誤訊息。");
    } finally {
        showLoading(false);
    }
}

        // ── 刪除簽呈 ──────────────────────────────────────────────
        // ✅ 修正：補回原本缺少的 deleteDocumentFromCloud 函式
        async function deleteDocumentFromCloud() {
            if (currentSelectedIndex === null || !isAdmin) return;

            const doc = filteredDocuments[currentSelectedIndex];
            if (!doc) return;

            if (!confirm(`確定要刪除「${doc.title}」這筆簽呈？此操作無法復原。`)) return;

            showLoading(true);
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/documents?id=eq.${doc.id}`, {
                    method: 'DELETE',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Prefer": "return=minimal"
                    }
                });

                if (!response.ok) {
                    // 讀出 Supabase 完整錯誤內容
                    let errBody = '';
                    try { errBody = await response.text(); } catch(_) {}
                    throw new Error(`狀態碼 ${response.status}｜${errBody}`);
                }

                currentSelectedIndex = null;
                document.getElementById('detail-section').classList.add('hidden');
                await fetchDataFromCloud();
            } catch (error) {
                console.error("刪除失敗:", error);
                alert("刪除失敗，錯誤訊息：\n" + error.message);
            } finally {
                showLoading(false);
            }
        }

        // ── 雲端儲存工具函式 ──────────────────────────────────────
        async function saveToCloud(doc) {
            let cleanData = { ...doc };
            delete cleanData.id;
            delete cleanData.created_at;

            await fetch(`${SUPABASE_URL}/rest/v1/documents?id=eq.${doc.id}`, {
                method: 'PATCH',
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(cleanData)
            });
        }

        // ── 啟動 ──────────────────────────────────────────────────
        fetchDataFromCloud();
    </script>
