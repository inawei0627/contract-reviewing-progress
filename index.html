<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簽呈進度管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">簽呈進度管理系統</h1>
            <button id="auth-btn" onclick="handleAuthClick()" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-bold shadow hover:bg-blue-700">管理員登入</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 bg-white p-5 rounded-xl shadow-lg border">
                <h2 class="font-bold mb-4 border-b pb-2">簽呈列表</h2>
                <div id="doc-list" class="space-y-3"></div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg border">
                <div id="detail-empty" class="text-center py-20 text-gray-400">請從左側選擇一筆簽呈</div>
                <div id="detail-content" class="hidden">
                    <h2 id="detail-title" class="text-xl font-bold mb-4"></h2>
                    
                    <div id="admin-panel" class="hidden p-4 bg-indigo-50 rounded-lg mb-6 border border-indigo-100">
                        <label class="block text-sm font-bold mb-2">管理員更新：</label>
                        <select id="action-stage" class="w-full p-2 mb-3 border rounded">
                            <option value="部門主管">部門主管</option>
                            <option value="法務">法務</option>
                            <option value="採購部">採購部</option>
                            <option value="5樓(執行長.董事長)">5樓(執行長.董事長)</option>
                        </select>
                        <input type="text" id="action-note" placeholder="簽核意見..." class="w-full p-2 mb-3 border rounded text-sm">
                        <div class="flex gap-2">
                            <button onclick="updateDocStatus('審核中')" class="flex-1 bg-amber-500 text-white py-2 rounded">送下一關</button>
                            <button onclick="updateDocStatus('已核准')" class="flex-1 bg-green-600 text-white py-2 rounded">核准</button>
                            <button onclick="updateDocStatus('被駁回')" class="flex-1 bg-red-600 text-white py-2 rounded">駁回</button>
                        </div>
                    </div>

                    <div id="timelineContainer" class="border-l-2 border-gray-200 ml-2 pl-6 space-y-6"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="password-modal" class="fixed inset-0 bg-gray-900/50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-80 shadow-xl">
            <h3 class="font-bold mb-4">請輸入管理密碼</h3>
            <input type="password" id="modal-password-input" class="border p-2 mb-4 w-full rounded">
            <button onclick="verifyAdminPassword()" class="w-full bg-blue-600 text-white p-2 rounded">確認登入</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://arosasnpwfkaiaglocex.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-LCdnK_X_Wh56tHtvWgx1g_-L20U16t";
        let documents = [], isAdmin = false, activeIndex = null;

        async function loadData() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/documents?select=*`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            documents = data.map(d => ({ db_id: d.id, ...d.data }));
            renderList();
        }

        function renderList() {
            document.getElementById('doc-list').innerHTML = documents.map((d, i) => `
                <div onclick="selectDoc(${i})" class="p-3 border rounded cursor-pointer hover:bg-blue-50 transition">
                    <div class="font-bold text-sm">${d.title}</div>
                    <div class="text-xs text-gray-500">狀態：${d.status}</div>
                </div>
            `).join('');
        }

        function selectDoc(i) {
            activeIndex = i;
            const d = documents[i];
            document.getElementById('detail-empty').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('detail-title').innerText = d.title;
            renderTimeline(d);
        }

        // 純日期選擇器渲染邏輯
        function renderTimeline(doc) {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = (doc.history || []).map((node, i) => `
                <div class="relative">
                    <div class="absolute -left-[33px] w-4 h-4 rounded-full bg-blue-500"></div>
                    <div class="font-bold text-sm">${node.stage}</div>
                    ${isAdmin ? `
                        <input type="date" value="${node.time ? node.time.split(' ')[0] : ''}" 
                               onchange="updateTimeline(${i}, this.value)" class="border p-1 text-xs w-full mt-1 bg-yellow-50 rounded">
                    ` : `<div class="text-xs text-gray-400 mt-1">${node.time ? node.time.split(' ')[0] : ''}</div>`}
                    <div class="text-sm bg-gray-50 p-2 mt-2 rounded">意見：${node.note || '無'}</div>
                </div>
            `).join('');
        }

        async function updateTimeline(idx, dateVal) {
            const d = documents[activeIndex];
            d.history[idx].time = dateVal; // 只儲存日期
            await saveDoc(d);
        }

        async function updateDocStatus(status) {
            const d = documents[activeIndex];
            d.status = status;
            d.history.push({ 
                stage: document.getElementById('action-stage').value, 
                time: new Date().toISOString().split('T')[0], 
                note: document.getElementById('action-note').value 
            });
            await saveDoc(d);
        }

        async function saveDoc(doc) {
            const db_id = doc.db_id;
            delete doc.db_id;
            await fetch(`${SUPABASE_URL}/rest/v1/documents?id=eq.${db_id}`, {
                method: 'PATCH',
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ data: doc })
            });
            loadData().then(() => selectDoc(activeIndex));
        }

        function handleAuthClick() {
            if(isAdmin) { isAdmin = false; location.reload(); }
            else { document.getElementById('password-modal').classList.remove('hidden'); }
        }

        function verifyAdminPassword() {
            if(document.getElementById('modal-password-input').value === 'admin123') {
                isAdmin = true;
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('password-modal').classList.add('hidden');
                document.getElementById('auth-btn').innerText = "登出管理員";
                if(activeIndex !== null) selectDoc(activeIndex);
            } else { alert("密碼錯誤"); }
        }

        loadData();
    </script>
</body>
</html>
